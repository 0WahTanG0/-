          #progressCard{background:#1b2533;border:1px solid #334459;border-radius:14px;padding:12px;margin-bottom:12px}
          #progressCard .big{font-size:18px;font-weight:900;color:#ffd166}
          #progressCard .muted{font-size:13px;color:#bdc7d5;line-height:1.45;margin-top:5px}
          #progressCard .contract{margin-top:9px;padding:9px;background:#253346;border-radius:10px;font-size:13px;line-height:1.4}
          #upBtn{pointer-events:auto;background:linear-gradient(145deg,#ffb703,#fb8500);color:#111822;border:1px solid #ffe699;font-weight:900;font-size:16px;padding:10px 16px;border-radius:24px;box-shadow:0 4px 14px rgba(251,133,0,.4)}
          #hint{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:rgba(16,22,32,.85);color:#fff;font-weight:700;font-size:15px;padding:8px 16px;border-radius:18px;border:1px solid rgba(255,255,255,.15);white-space:nowrap;pointer-events:none;z-index:5;transition:opacity .3s}
          #joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.45);display:none;pointer-events:none;z-index:6;backdrop-filter:blur(3px)}
          #knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffffff,#cbd5e1);box-shadow:0 4px 10px rgba(0,0,0,.35)}
          .pop{position:fixed;font-weight:900;font-size:22px;color:#ffd166;text-shadow:0 2px 0 #4a3200,0 0 8px rgba(0,0,0,.5);pointer-events:none;z-index:4;transform:translate(-50%,-50%);white-space:nowrap}
          #panel{position:fixed;inset:0;background:rgba(8,12,20,.68);display:none;align-items:center;justify-content:center;z-index:10;backdrop-filter:blur(4px)}
          #panel .box{background:#18212e;border:1px solid #2e3e52;border-radius:20px;padding:18px;width:min(92vw,400px);color:#fff;max-height:88vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.6)}
          #panel h2{margin:0 0 12px;font-size:22px;text-align:center;color:#ffb703}
          .up{display:flex;align-items:center;gap:10px;background:#222e40;border:1px solid #2f3f56;border-radius:14px;padding:10px 12px;margin-bottom:10px}
          .up .t{flex:1}.up .n{font-weight:800;font-size:16px}.up .d{font-size:13px;color:#a0aec0;margin-top:2px}
          .up .lv{font-size:12px;color:#48bb78;margin-top:4px}
          .up button{border:0;border-radius:12px;padding:10px 12px;font-weight:800;font-size:15px;background:linear-gradient(145deg,#ffb703,#fb8500);color:#111822;min-width:84px;transition:transform .12s,filter .12s}
          .up button:active{transform:scale(.95);filter:brightness(1.15)}
          .up button.no{background:#3b4659;color:#8c9ab0}
          #close{display:block;width:100%;margin-top:6px;border:0;border-radius:14px;padding:12px;font-weight:800;font-size:16px;background:#3b4659;color:#fff}
          #reset{display:block;width:100%;margin-top:8px;border:0;background:none;color:#718096;font-size:13px;padding:6px}
          #toast{position:fixed;left:50%;top:28%;transform:translate(-50%,-12px) scale(.92);opacity:0;pointer-events:none;z-index:20;background:linear-gradient(135deg,#1b2534,#2d3e54);border:2px solid #ffb703;color:#fff;border-radius:18px;padding:14px 20px;text-align:center;min-width:190px;max-width:82vw;box-shadow:0 12px 36px #0009;transition:opacity .22s,transform .22s}
          #toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
          #toast .icon{font-size:30px;display:block;margin-bottom:4px}
          #toast .title{font-weight:900;font-size:18px;color:#ffd166}
          #toast .sub{font-size:13px;color:#e2e8f0;margin-top:4px}
          #toast.pulse{animation:toastPulse .55s ease-out}
          #toast.kind-building{border-color:#56c8f2;animation:buildingReveal .7s cubic-bezier(.2,.9,.25,1.2)}
          #toast.kind-level{border-color:#ffe08a;animation:levelReveal .8s cubic-bezier(.2,.9,.25,1.2)}
          #toast.kind-tool{border-color:#72d7a1;animation:toolReveal .45s ease-out}
          #toast.kind-job{border-color:#8ac7ff;animation:jobReveal .55s ease-out}
          @keyframes toastPulse{0%{box-shadow:0 0 0 0 #f0a50099}100%{box-shadow:0 0 0 22px #f0a50000}}
          @keyframes buildingReveal{0%{transform:translate(-50%,30px) scale(.45) rotate(-5deg);filter:brightness(1.8)}70%{transform:translate(-50%,-4px) scale(1.06)}100%{transform:translate(-50%,0) scale(1)}}
          @keyframes levelReveal{0%{transform:translate(-50%,-25px) scale(.6);filter:brightness(2)}55%{transform:translate(-50%,0) scale(1.12)}100%{transform:translate(-50%,0) scale(1)}}
          @keyframes toolReveal{0%{transform:translate(-50%,0) scale(.65) rotate(4deg)}60%{transform:translate(-50%,0) scale(1.08) rotate(-2deg)}100%{transform:translate(-50%,0) scale(1)}}
          @keyframes jobReveal{0%{transform:translate(-50%,12px) scale(.8);opacity:0}100%{transform:translate(-50%,0) scale(1);opacity:1}}
          </style>
          </head>
          <body>
          <div id="hud">
            <div>
              <div id="money">0 ₽</div>
              <div id="rank">
                <div id="rankTitle">Уровень 1 · Новичок</div>
                <small id="rankXp">0 / 100 опыта</small>
                <div class="bar"><div id="rankFill"></div></div>
              </div>
              <div id="repCard"><span id="repText">Репутация мастерской · 50/100</span><div class="bar"><div id="repFill"></div></div></div>
              <div id="comboBadge">🔥 Серия быстрого сервиса ×2</div>
            </div>
            <button id="upBtn">⬆ Развитие</button>
          </div>
          <div id="hint"></div>
          <div id="toast" role="status" aria-live="polite"><span class="icon">🔧</span><div class="title">Улучшение</div><div class="sub"></div></div>
          <div id="joy"><div id="knob"></div></div>
          <div id="toolStatus">Инструмент: Замена стекла<small>Склад: 0/3 стекол · 0/3 наборов · 0/3 плёнок</small></div>
          <div id="toolPanel">
            <button class="toolBtn active" data-tool="replacement">🪟 Замена</button>
            <button class="toolBtn" data-tool="repair">🛠 Ремонт</button>
            <button class="toolBtn" data-tool="tint">🎞 Тонировка</button>
          </div>
          <div id="panel">
            <div class="box">
              <h2>Развитие мастерской</h2>
              <div id="progressCard"></div>
              <div id="ups"></div>
              <button id="soundBtn" style="display:block;width:100%;margin-top:8px;border:0;border-radius:14px;padding:11px;font-weight:800;background:#35445a;color:#fff">🔊 Звуки: включены</button>
              <button id="close">Закрыть</button>
              <button id="reset">Начать заново</button>
            </div>
          </div>
          <div id="vignette"></div>
          <script src="three.min.js"></script>
          <script>
          'use strict';
          // ================== Константы мира ==================
          const BAYX = [-2, 4, 10];
          const CAR_Z = -7.4;
          const WORK_Z = -3.5;
          const LANE_Z = -14;
          const ROAD_X = -10;
          const WARE = { x: -4, z: 6.0 };
          const CASH = { x: 9.5, z: 5.3 };
          const BOUNDS = { x0: -6.4, x1: 15.4, z0: -4.7, z1: 10.2 };

          const CAR_TYPES = [
            { name: 'Хэтчбек', price: 40, s: [1, 1, 0.96], need: 0 },
            { name: 'Седан', price: 60, s: [1.02, 1, 1.08], need: 1 },
            { name: 'Внедорожник', price: 90, s: [1.1, 1.2, 1.1], need: 3 },
            { name: 'Универсал', price: 75, s: [1.02, 1.05, 1.16], need: 2 },
            { name: 'Купе', price: 105, s: [1.05, 0.9, 1.04], need: 4 },
            { name: 'Премиум-кроссовер', price: 125, s: [1.14, 1.24, 1.15], need: 5 },
            { name: 'Грузовик', price: 140, s: [1.16, 1.38, 1.22], need: 6 },
          ];
          const CAR_COLORS = [0xb81d24, 0x1d63b8, 0xe8edf2, 0x1c2127, 0x1b7a43, 0xd97706, 0x5b21b6, 0x64748b, 0x0f766e, 0xc2410c];
          const SERVICES = {
            replacement: { label: 'ЗАМЕНА', icon: '🪟', tool: 'replacement', price: 1.45, name: 'Замена лобового' },
            repair: { label: 'РЕМОНТ', icon: '🛠', tool: 'repair', price: 1, name: 'Ремонт стекла' },
            tint: { label: 'ТОНИРОВКА', icon: '🎞', tool: 'tint', price: 1.2, name: 'Тонировка' }
          };
          const SERVICE_KEYS = Object.keys(SERVICES);
          let selectedTool = 'replacement';
          let fastStreak = 0;

          const ZONES = [
            { id: 'bay2', name: 'Бокс 2', cost: 150, x: 4, z: WORK_Z, req: [] },
            { id: 'loader1', name: 'Грузчик', cost: 250, x: -0.6, z: 6.6, req: ['bay2'] },
            { id: 'mech1', name: 'Мастер', cost: 350, x: -4.4, z: WORK_Z, req: ['loader1'] },
            { id: 'bay3', name: 'Бокс 3', cost: 600, x: 10, z: WORK_Z, req: ['mech1'] },
            { id: 'cashier', name: 'Кассир', cost: 500, x: 12.8, z: 5.6, req: ['bay3'] },
            { id: 'mech2', name: 'Мастер', cost: 700, x: 1.6, z: WORK_Z, req: ['cashier'] },
            { id: 'mech3', name: 'Мастер', cost: 900, x: 7.6, z: WORK_Z, req: ['mech2'] },
            { id: 'loader2', name: 'Грузчик', cost: 1000, x: 1.8, z: 6.6, req: ['mech3'] },
          ];

          const UPGS = [
            { k: 'speed', name: 'Кроссовки', desc: 'Быстрее бегаешь', base: 60, max: 5 },
            { k: 'cap', name: 'Крепкая спина', desc: '+1 к переносимым стеклам, наборам и плёнкам', base: 80, max: 5 },
            { k: 'work', name: 'Инструменты', desc: 'Быстрее замена, ремонт и тонировка', base: 100, max: 5 },
            { k: 'price', name: 'Реклама', desc: '+15% к оплате', base: 150, max: 5 },
            { k: 'staff', name: 'Обучение персонала', desc: 'Работники быстрее', base: 200, max: 5 },
          ];

          // ================== Сохранение ==================
          let save = { money: 0, unlocked: [], paid: {}, up: {}, cars: 0, xp: 0, level: 1, contractClaimed: 0, reputation: 50 };
          try { const s = JSON.parse(localStorage.getItem('steklo3d') || 'null'); if (s) save = Object.assign(save, s); } catch (e) {}
          UPGS.forEach(u => { if (save.up[u.k] == null) save.up[u.k] = 0; });
          if (!Number.isFinite(save.xp)) save.xp = 0;
          if (!Number.isFinite(save.level)) save.level = 1;
          if (!Number.isFinite(save.contractClaimed)) save.contractClaimed = 0;
          if (!Number.isFinite(save.reputation)) save.reputation = 50;
          save.reputation = Math.max(0, Math.min(100, save.reputation));
          function persist() { try { localStorage.setItem('steklo3d', JSON.stringify(save)); } catch (e) {} }
          const has = id => save.unlocked.includes(id);
          const playerSpeed = () => 4.2 + save.up.speed * 0.7;
          const playerCap = () => 3 + save.up.cap;
          const workTime = () => 2.6 * Math.pow(0.82, save.up.work);
          const priceMul = () => (1 + 0.15 * save.up.price) * (0.8 + save.reputation * 0.004);
          const staffMul = () => 1 + 0.2 * save.up.staff;
          const upCost = u => Math.round(u.base * Math.pow(save.up[u.k] + 1, 1.7));

          // ================== Three.js & PBR Renderer ==================
          const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
          renderer.shadowMap.enabled = true;
          renderer.shadowMap.type = THREE.PCFSoftShadowMap;
          renderer.outputColorSpace = THREE.SRGBColorSpace;
          renderer.toneMapping = THREE.ACESFilmicToneMapping;
          renderer.toneMappingExposure = 1.16;
          document.body.appendChild(renderer.domElement);

          const scene = new THREE.Scene();
          scene.background = new THREE.Color(0x88b8d6);
          scene.fog = new THREE.FogExp2(0x9bc5df, 0.012);
          const camera = new THREE.PerspectiveCamera(48, 1, 0.5, 200);
          const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy() || 4);

          function canvasTex(w, h, draw, srgb = true) {
            const c = document.createElement('canvas'); c.width = w; c.height = h;
            draw(c.getContext('2d'), w, h);
            const t = new THREE.CanvasTexture(c);
            t.anisotropy = maxAniso;
            if (srgb) t.colorSpace = THREE.SRGBColorSpace;
            return t;
          }
          function tiledTex(w, h, rx, ry, draw, srgb = true) {
            const t = canvasTex(w, h, draw, srgb);
            t.wrapS = t.wrapT = THREE.RepeatWrapping;
            t.repeat.set(rx, ry);
            t.userData = { shared: true };
            return t;
          }

          // ---- Небесный купол с облаками и атмосферным рассеиванием ----
          (function skyDome() {
            const skyTex = canvasTex(512, 256, (g, W, H) => {
              const grad = g.createLinearGradient(0, 0, 0, H);
              grad.addColorStop(0, '#2a6ca8');
              grad.addColorStop(0.38, '#66a6d6');
              grad.addColorStop(0.72, '#b8dcf0');
              grad.addColorStop(1, '#e6f0e6');
              g.fillStyle = grad; g.fillRect(0, 0, W, H);
              for (let i = 0; i < 45; i++) {
                const cx = Math.random() * W, cy = H * (0.28 + Math.random() * 0.35), r = 18 + Math.random() * 48;
                const cg = g.createRadialGradient(cx, cy, 2, cx, cy, r);
                cg.addColorStop(0, 'rgba(255,255,255,0.28)');
                cg.addColorStop(1, 'rgba(255,255,255,0)');
                g.fillStyle = cg; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
              }
            });
            const sky = new THREE.Mesh(new THREE.SphereGeometry(145, 28, 18),
              new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false, depthWrite: false }));
            sky.renderOrder = -10;
            scene.add(sky);
          })();

          // ---- PBR Environment Map со студийными софтбоксами для реалистичных бликов на авто ----
          const pmrem = new THREE.PMREMGenerator(renderer);
          pmrem.compileEquirectangularShader();
          const envScene = new THREE.Scene();
          envScene.background = (() => {
            const t = canvasTex(512, 256, (g, W, H) => {
              const grad = g.createLinearGradient(0, 0, 0, H);
              grad.addColorStop(0, '#1e5799');
              grad.addColorStop(0.42, '#b8dcff');
              grad.addColorStop(0.49, '#ffffff');
              grad.addColorStop(0.52, '#5a636b');
              grad.addColorStop(1, '#262d35');
              g.fillStyle = grad; g.fillRect(0, 0, W, H);
              // Яркие студийные лампы-софтбоксы в карте отражений
              g.fillStyle = '#ffffff';
              for (let i = 0; i < 4; i++) {
                g.fillRect(35 + i * 125, 38, 82, 18);
                g.fillRect(55 + i * 120, 78, 60, 10);
              }
            });
            t.mapping = THREE.EquirectangularReflectionMapping;
            return t;
          })();
          const envMap = pmrem.fromScene(envScene, 0.025).texture;
          envMap.userData = { shared: true };
          envScene.background = null;
          pmrem.dispose();
          scene.environment = envMap;

          // ================== Генератор процедурных PBR-текстур и карт рельефа ==================
          const TEX = {
            // 1. Эпоксидный плиточный пол мастерской
            shopFloorMap: tiledTex(256, 256, 12, 11, (g, W, H) => {
              g.fillStyle = '#cbd2da'; g.fillRect(0, 0, W, H);
              for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
                const v = 205 + ((x + y) % 2) * 8 + (Math.random() * 6 - 3);
                g.fillStyle = `rgb(${v},${v + 4},${v + 9})`;
                g.fillRect(x * 64 + 2, y * 64 + 2, 60, 60);
                // диагональный блик на плитке
                g.fillStyle = 'rgba(255,255,255,0.08)';
                g.beginPath(); g.moveTo(x * 64 + 2, y * 64 + 2); g.lineTo(x * 64 + 42, y * 64 + 2); g.lineTo(x * 64 + 2, y * 64 + 42); g.fill();
              }
              for (let i = 0; i < 900; i++) {
                g.fillStyle = i % 2 ? 'rgba(255,255,255,0.12)' : 'rgba(30,45,60,0.08)';
                g.fillRect(Math.random() * W, Math.random() * H, 2, 2);
              }
              g.strokeStyle = '#909ba8'; g.lineWidth = 3;
              for (let i = 0; i <= W; i += 64) {
                g.beginPath(); g.moveTo(i, 0); g.lineTo(i, H); g.stroke();
                g.beginPath(); g.moveTo(0, i); g.lineTo(W, i); g.stroke();
              }
            }),
            shopFloorBump: tiledTex(256, 256, 12, 11, (g, W, H) => {
              g.fillStyle = '#e0e0e0'; g.fillRect(0, 0, W, H);
              g.strokeStyle = '#252525'; g.lineWidth = 4;
              for (let i = 0; i <= W; i += 64) {
                g.beginPath(); g.moveTo(i, 0); g.lineTo(i, H); g.stroke();
                g.beginPath(); g.moveTo(0, i); g.lineTo(W, i); g.stroke();
              }
              for (let i = 0; i < 600; i++) {
                g.fillStyle = i % 2 ? '#ffffff' : '#b8b8b8';
                g.fillRect(Math.random() * W, Math.random() * H, 2, 2);
              }
            }, false),

            // 2. Резиновое антискользящее покрытие рабочего бокса
            bayFloorMap: tiledTex(256, 256, 3, 3, (g, W, H) => {
              g.fillStyle = '#333d4b'; g.fillRect(0, 0, W, H);
              g.strokeStyle = '#252d38'; g.lineWidth = 3;
              for (let i = 0; i <= W; i += 64) {
                g.beginPath(); g.moveTo(i, 0); g.lineTo(i, H); g.stroke();
                g.beginPath(); g.moveTo(0, i); g.lineTo(W, i); g.stroke();
              }
              for (let y = 8; y < H; y += 16) for (let x = 8; x < W; x += 16) {
                g.fillStyle = '#435062'; g.beginPath(); g.arc(x, y, 3.2, 0, Math.PI * 2); g.fill();
                g.fillStyle = '#222933'; g.beginPath(); g.arc(x + 1, y + 1, 2.2, 0, Math.PI * 2); g.fill();
              }
            }),
            bayFloorBump: tiledTex(256, 256, 3, 3, (g, W, H) => {
              g.fillStyle = '#808080'; g.fillRect(0, 0, W, H);
              for (let y = 8; y < H; y += 16) for (let x = 8; x < W; x += 16) {
                g.fillStyle = '#ffffff'; g.beginPath(); g.arc(x, y, 3.5, 0, Math.PI * 2); g.fill();
              }
            }, false),

            // 3. Черно-желтая сигнальная разметка бокса
            hazardMap: tiledTex(128, 128, 1, 14, (g, W, H) => {
              g.fillStyle = '#eab308'; g.fillRect(0, 0, W, H);
              g.fillStyle = '#181d24';
              for (let i = -H; i < W + H; i += 32) {
                g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 16, 0); g.lineTo(i - 16, H); g.lineTo(i - 32, H); g.fill();
              }
            }),

            // 4. Зернистый асфальт
            asphaltMap: tiledTex(256, 256, 3, 18, (g, W, H) => {
              g.fillStyle = '#2d323a'; g.fillRect(0, 0, W, H);
              for (let i = 0; i < 4500; i++) {
                const v = 32 + Math.floor(Math.random() * 38);
                g.fillStyle = `rgb(${v},${v + 2},${v + 5})`;
                g.fillRect(Math.random() * W, Math.random() * H, 2, 2);
              }
            }),
            asphaltBump: tiledTex(256, 256, 3, 18, (g, W, H) => {
              g.fillStyle = '#808080'; g.fillRect(0, 0, W, H);
              for (let i = 0; i < 4500; i++) {
                const v = Math.floor(Math.random() * 255);
                g.fillStyle = `rgb(${v},${v},${v})`;
                g.fillRect(Math.random() * W, Math.random() * H, 2, 2);
              }
            }, false),

            // 5. Индустриальные стеновые сэндвич-панели
            wallMap: tiledTex(256, 256, 6, 1, (g, W, H) => {
              const grad = g.createLinearGradient(0, 0, 0, H);
              grad.addColorStop(0, '#eef2f6');
              grad.addColorStop(0.76, '#dce3ec');
              grad.addColorStop(0.77, '#f59e0b');
              grad.addColorStop(0.83, '#d97706');
              grad.addColorStop(0.84, '#334155');
              grad.addColorStop(1, '#1e293b');
              g.fillStyle = grad; g.fillRect(0, 0, W, H);
              for (let x = 0; x < W; x += 32) {
                g.fillStyle = 'rgba(0,0,0,0.08)'; g.fillRect(x, 0, 3, H * 0.76);
                g.fillStyle = 'rgba(255,255,255,0.4)'; g.fillRect(x + 3, 0, 2, H * 0.76);
              }
            }),
            wallBump: tiledTex(256, 256, 6, 1, (g, W, H) => {
              g.fillStyle = '#b0b0b0'; g.fillRect(0, 0, W, H);
              for (let x = 0; x < W; x += 32) {
                g.fillStyle = '#303030'; g.fillRect(x, 0, 4, H);
                g.fillStyle = '#ffffff'; g.fillRect(x + 4, 0, 4, H);
              }
            }, false),

            // 6. Деревянная стойка кассы под лаком
            woodMap: tiledTex(256, 256, 2, 1, (g, W, H) => {
              g.fillStyle = '#7c4d30'; g.fillRect(0, 0, W, H);
              for (let y = 0; y < H; y += 3) {
                g.fillStyle = y % 6 === 0 ? 'rgba(45,22,8,0.22)' : 'rgba(210,145,95,0.14)';
                g.fillRect(0, y, W, 2);
              }
              g.strokeStyle = 'rgba(35,16,5,0.35)'; g.lineWidth = 2;
              for (let y = 0; y < H; y += 64) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
            }),

            // 7. Рифленый металл (стеллажи, тележки, оборудование)
            metalBump: tiledTex(128, 128, 3, 3, (g, W, H) => {
              g.fillStyle = '#808080'; g.fillRect(0, 0, W, H);
              g.fillStyle = '#ffffff';
              for (let y = 0; y < H; y += 16) for (let x = 0; x < W; x += 16) {
                g.fillRect(x + 3, y + 6, 10, 4);
                g.fillRect(x + 6, y + 3, 4, 10);
              }
            }, false),

            // 8. Микрорельеф автоэмали и ткани одежды
            flakeBump: tiledTex(128, 128, 6, 6, (g, W, H) => {
              g.fillStyle = '#808080'; g.fillRect(0, 0, W, H);
              for (let i = 0; i < 1600; i++) {
                const v = 100 + Math.floor(Math.random() * 110);
                g.fillStyle = `rgb(${v},${v},${v})`;
                g.fillRect(Math.random() * W, Math.random() * H, 1.5, 1.5);
              }
            }, false),
            fabricBump: tiledTex(64, 64, 8, 8, (g, W, H) => {
              g.fillStyle = '#808080'; g.fillRect(0, 0, W, H);
              g.fillStyle = '#b5b5b5';
              for (let y = 0; y < H; y += 4) for (let x = (y % 8 ? 2 : 0); x < W; x += 4) g.fillRect(x, y, 2, 2);
            }, false),

            // 9. Боковина шины с протектором
            tireBump: canvasTex(128, 128, (g, W, H) => {
              g.fillStyle = '#505050'; g.fillRect(0, 0, W, H);
              g.strokeStyle = '#ffffff'; g.lineWidth = 5;
              for (let a = 0; a < Math.PI * 2; a += Math.PI / 12) {
                g.beginPath();
                g.moveTo(64 + Math.cos(a) * 42, 64 + Math.sin(a) * 42);
                g.lineTo(64 + Math.cos(a) * 62, 64 + Math.sin(a) * 62);
                g.stroke();
              }
            }, false),

            // 10. Купюры
            banknoteMap: canvasTex(128, 64, (g, W, H) => {
              g.fillStyle = '#2e7d32'; g.fillRect(0, 0, W, H);
              g.strokeStyle = '#a5d6a7'; g.lineWidth = 4; g.strokeRect(6, 6, W - 12, H - 12);
              g.fillStyle = '#66bb6a'; g.beginPath(); g.arc(W / 2, H / 2, 14, 0, Math.PI * 2); g.fill();
              g.fillStyle = '#e8f5e9'; g.font = 'bold 20px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle';
              g.fillText('₽', W / 2, H / 2 + 1);
            })
          };
          TEX.tireBump.userData = { shared: true };
          TEX.banknoteMap.userData = { shared: true };

          // ---- Освещение сцены ----
          scene.add(new THREE.HemisphereLight(0xf2f8ff, 0x45523e, 0.95));
          const sun = new THREE.DirectionalLight(0xfff4df, 2.25);
          sun.castShadow = true;
          sun.shadow.mapSize.set(2048, 2048);
          Object.assign(sun.shadow.camera, { left: -19, right: 19, top: 19, bottom: -19, near: 1, far: 60 });
          sun.shadow.bias = -0.0008;
          sun.shadow.radius = 2.0;
          scene.add(sun, sun.target);

          const fill = new THREE.DirectionalLight(0x9ec5ff, 0.55);
          scene.add(fill, fill.target);

          // Универсальный фабричный метод PBR-материалов вместо плоского «пластилина»
          const matCache = {};
          function M(c, opts = {}) {
            const key = c + '_' + (opts.r || 0.42) + '_' + (opts.m || 0.08) + '_' + (opts.b || '');
            if (matCache[key]) return matCache[key];
            const mat = new THREE.MeshStandardMaterial({
              color: c,
              roughness: opts.r !== undefined ? opts.r : 0.42,
              metalness: opts.m !== undefined ? opts.m : 0.08,
              bumpMap: opts.b === 'fabric' ? TEX.fabricBump : opts.b === 'metal' ? TEX.metalBump : TEX.flakeBump,
              bumpScale: opts.bs !== undefined ? opts.bs : 0.006,
              envMapIntensity: opts.env !== undefined ? opts.env : 0.95
            });
            mat.userData = { shared: true };
            matCache[key] = mat;
            return mat;
          }

          const box = (w, h, d, mat, x = 0, y = 0, z = 0, cast = true) => {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = true; return m;
          };
          function roundedBox(w, h, d, mat, x = 0, y = 0, z = 0, r = 0.1, cast = true) {
            r = Math.min(r, w * 0.22, h * 0.22, d * 0.22);
            const shape = new THREE.Shape();
            shape.moveTo(-w / 2 + r, -h / 2); shape.lineTo(w / 2 - r, -h / 2); shape.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
            shape.lineTo(w / 2, h / 2 - r); shape.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2);
            shape.lineTo(-w / 2 + r, h / 2); shape.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);
            shape.lineTo(-w / 2, -h / 2 + r); shape.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
            const depth = Math.max(0.05, d - r * 1.2);
            const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelSegments: 4, steps: 1, bevelSize: r * 0.32, bevelThickness: r * 0.32, curveSegments: 6 });
            geo.translate(0, 0, -depth / 2 - r * 0.32);
            const mesh = new THREE.Mesh(geo, mat); mesh.position.set(x, y, z); mesh.castShadow = cast; mesh.receiveShadow = true; return mesh;
          }
          const flat = (w, d, mat, x, y, z) => {
            const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
            m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); m.receiveShadow = true; return m;
          };
          function label(text, w, size, color = '#ffffff', x, z, rot = 0) {
            const tex = canvasTex(512, 128, (g, W, H) => {
              g.font = `900 ${size}px system-ui,Roboto,sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
              g.lineWidth = 12; g.strokeStyle = 'rgba(15,23,42,0.55)'; g.strokeText(text, W / 2, H / 2);
              g.fillStyle = color; g.fillText(text, W / 2, H / 2);
            });
            const m = flat(w, w / 4, new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }), x, 0.06, z);
            m.rotation.z = rot; scene.add(m); return m;
          }

          // ---- Текстуры лобового стекла ----
          const crackTex = canvasTex(512, 256, (g, W, H) => {
            const grad = g.createLinearGradient(0, 0, W, H);
            grad.addColorStop(0, '#4f86b0'); grad.addColorStop(0.5, '#77b5df'); grad.addColorStop(1, '#3b698c');
            g.fillStyle = grad; g.fillRect(0, 0, W, H);
            // темная шелкография (окантовка стекла)
            g.strokeStyle = '#111822'; g.lineWidth = 18; g.strokeRect(0, 0, W, H);
            // блики
            g.fillStyle = 'rgba(255,255,255,0.28)';
            g.beginPath(); g.moveTo(110, 0); g.lineTo(190, 0); g.lineTo(95, H); g.lineTo(15, H); g.fill();
            // реалистичная паутина трещин
            const cx = 310, cy = 115;
            g.strokeStyle = 'rgba(255,255,255,0.92)'; g.lineWidth = 3.2;
            for (let i = 0; i < 16; i++) {
              let a = i / 16 * Math.PI * 2, x = cx, y = cy;
              g.beginPath(); g.moveTo(x, y);
              for (let s = 0; s < 6; s++) {
                a += (Math.random() - 0.5) * 0.45;
                x += Math.cos(a) * 32; y += Math.sin(a) * 22;
                g.lineTo(x, y);
              }
              g.stroke();
            }
            g.lineWidth = 2.2;
            for (const r of [24, 48, 76]) { g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke(); }
            g.fillStyle = '#ffffff'; g.beginPath(); g.arc(cx, cy, 8, 0, Math.PI * 2); g.fill();
          });
          crackTex.userData = { shared: true };

          const cleanTex = canvasTex(512, 256, (g, W, H) => {
            const grad = g.createLinearGradient(0, 0, W, H);
            grad.addColorStop(0, '#5a9bc8'); grad.addColorStop(0.5, '#92ccf0'); grad.addColorStop(1, '#4882ad');
            g.fillStyle = grad; g.fillRect(0, 0, W, H);
            g.strokeStyle = '#111822'; g.lineWidth = 18; g.strokeRect(0, 0, W, H);
            g.fillStyle = 'rgba(255,255,255,0.38)';
            g.beginPath(); g.moveTo(110, 0); g.lineTo(205, 0); g.lineTo(110, H); g.lineTo(15, H); g.fill();
            g.fillStyle = 'rgba(255,255,255,0.2)';
            g.beginPath(); g.moveTo(240, 0); g.lineTo(275, 0); g.lineTo(180, H); g.lineTo(145, H); g.fill();
          });
          cleanTex.userData = { shared: true };

          const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0xa8e0ff, roughness: 0.06, metalness: 0.05, transparent: true, opacity: 0.9,
            clearcoat: 1, clearcoatRoughness: 0.04, reflectivity: 0.95, envMap, envMapIntensity: 1.4
          });
          glassMat.userData = { shared: true };

          const moneyMat = new THREE.MeshStandardMaterial({ map: TEX.banknoteMap, roughness: 0.55, metalness: 0.05 });
          moneyMat.userData = { shared: true };
          const glassGeo = new THREE.BoxGeometry(0.95, 0.06, 0.62);
          glassGeo.userData = { shared: true };
          const moneyGeo = new THREE.BoxGeometry(0.5, 0.11, 0.26);
          moneyGeo.userData = { shared: true };

          // ================== Окружение с PBR-покрытиями ==================
          const groundTex = tiledTex(512, 512, 48, 48, (g, W, H) => {
            g.fillStyle = '#4e7d34'; g.fillRect(0, 0, W, H);
            for (let i = 0; i < 5500; i++) {
              const x = Math.random() * W, y = Math.random() * H;
              g.strokeStyle = i % 3 === 0 ? '#3a6124' : i % 3 === 1 ? '#649943' : '#7ab054';
              g.lineWidth = 2;
              g.beginPath(); g.moveTo(x, y); g.lineTo(x + (Math.random() - 0.5) * 4, y - 4 - Math.random() * 5); g.stroke();
            }
          });
          const groundMat = new THREE.MeshStandardMaterial({ map: groundTex, bumpMap: TEX.asphaltBump, bumpScale: 0.04, roughness: 0.92, metalness: 0 });
          scene.add(flat(220, 220, groundMat, 0, 0, 0));

          const blobTex = canvasTex(128, 128, (g, W, H) => {
            const grad = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W / 2);
            grad.addColorStop(0, 'rgba(0,0,0,0.48)'); grad.addColorStop(0.68, 'rgba(0,0,0,0.18)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
            g.fillStyle = grad; g.fillRect(0, 0, W, H);
          });
          blobTex.userData = { shared: true };

          function contactShadow(w, d, x, z, y = 0.015, parent = scene) {
            const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false }));
            m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); m.renderOrder = -1; parent.add(m); return m;
          }

          // Асфальтовая дорога и бордюры
          const roadMat = new THREE.MeshStandardMaterial({ map: TEX.asphaltMap, bumpMap: TEX.asphaltBump, bumpScale: 0.035, roughness: 0.82, metalness: 0.04 });
          scene.add(flat(5.2, 62, roadMat, ROAD_X, 0.012, 7));
          scene.add(flat(44, 5.2, roadMat, 8.5, 0.012, LANE_Z));
          const curbMat = M(0x94a3b8, { r: 0.7, m: 0.05 });
          scene.add(box(0.28, 0.14, 62, curbMat, ROAD_X - 2.7, 0.07, 7));
          scene.add(box(44, 0.14, 0.28, curbMat, 8.5, 0.07, LANE_Z - 2.7));
          for (let z = -10; z < 36; z += 4) scene.add(flat(0.22, 1.9, M(0xf8fafc, { r: 0.5 }), ROAD_X, 0.022, z));
          for (let x = -6; x < 30; x += 4) scene.add(flat(1.9, 0.22, M(0xf8fafc, { r: 0.5 }), x, 0.022, LANE_Z));

          // Главный эпоксидный пол мастерской
          const shopFloorMat = new THREE.MeshStandardMaterial({
            map: TEX.shopFloorMap, bumpMap: TEX.shopFloorBump, bumpScale: 0.015,
            roughness: 0.26, metalness: 0.1, envMapIntensity: 1.15
          });
          scene.add(flat(23.6, 21.2, shopFloorMat, 4.5, 0.02, 0));

          // Стены из сэндвич-панелей и стальные колонны
          const wallMat = new THREE.MeshStandardMaterial({ map: TEX.wallMap, bumpMap: TEX.wallBump, bumpScale: 0.025, roughness: 0.38, metalness: 0.22 });
          const steelBeamMat = M(0x263240, { r: 0.32, m: 0.75, b: 'metal' });
          const trimM = M(0xf59e0b, { r: 0.28, m: 0.45 });
          scene.add(box(0.42, 2.35, 21.2, wallMat, -7.3, 1.17, 0));
          scene.add(box(0.42, 2.35, 21.2, wallMat, 16.3, 1.17, 0));
          for (const z of [-10.4, -3.5, 3.5, 10.4]) {
            scene.add(box(0.54, 2.55, 0.54, steelBeamMat, -7.3, 1.27, z));
            scene.add(box(0.54, 2.55, 0.54, steelBeamMat, 16.3, 1.27, z));
          }
