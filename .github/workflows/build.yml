          function makeSlopedCabin(w, h, zFrontBot, zFrontTop, zBackTop, zBackBot, mat) {
            const s = new THREE.Shape();
            s.moveTo(zBackBot, 0);
            s.lineTo(zFrontBot, 0);
            s.lineTo(zFrontTop, h);
            s.lineTo(zBackTop, h);
            s.closePath();
            const geo = new THREE.ExtrudeGeometry(s, {
              depth: w - 0.16, bevelEnabled: true, bevelSegments: 4, steps: 1, bevelSize: 0.08, bevelThickness: 0.08
            });
            geo.rotateY(Math.PI / 2);
            geo.translate(-(w - 0.16) / 2, 0.9, 0);
            const m = new THREE.Mesh(geo, mat);
            m.castShadow = true; m.receiveShadow = true;
            return m;
          }

          function makeCar(type, color) {
            const g = new THREE.Group();
            const body = new THREE.MeshPhysicalMaterial({
              color, roughness: 0.18, metalness: 0.72,
              bumpMap: TEX.flakeBump, bumpScale: 0.0025,
              clearcoat: 1.0, clearcoatRoughness: 0.05,
              envMap, envMapIntensity: 1.35
            });
            contactShadow(2.7, 4.9, 0, 0, 0.018, g);

            // Нижний профилированный кузов + пороги + колесные арки
            g.add(roundedBox(1.94, 0.66, 4.28, body, 0, 0.58, 0, 0.16));
            g.add(roundedBox(2.02, 0.14, 2.5, trimDarkMat, 0, 0.31, 0, 0.04));
            for (const sx of [-0.94, 0.94]) for (const sz of [-1.35, 1.35]) {
              const arch = new THREE.Mesh(new THREE.CylinderGeometry(0.47, 0.47, 0.22, 20, 1, false, 0, Math.PI), trimDarkMat);
              arch.rotation.z = Math.PI / 2; arch.rotation.y = Math.PI / 2;
              arch.position.set(sx, 0.42, sz); g.add(arch);
            }

            // Кабина с настоящим наклоном стоек
            let cabH = 0.62, zFB = 0.95, zFT = 0.42, zBT = -1.05, zBB = -1.42;
            if (type.name === 'Хэтчбек') { zFB = 0.92; zFT = 0.38; zBT = -1.25; zBB = -1.75; }
            else if (type.name === 'Седан') { zFB = 0.95; zFT = 0.4; zBT = -0.95; zBB = -1.45; }
            else if (type.name === 'Универсал') { cabH = 0.66; zFB = 0.95; zFT = 0.4; zBT = -1.65; zBB = -1.98; }
            else if (type.name === 'Внедорожник' || type.name === 'Премиум-кроссовер') { cabH = 0.74; zFB = 0.98; zFT = 0.44; zBT = -1.62; zBB = -1.95; }
            else if (type.name === 'Купе') { cabH = 0.52; zFB = 0.92; zFT = 0.25; zBT = -0.95; zBB = -1.68; }
            else if (type.name === 'Грузовик') {
              cabH = 0.88; zFB = 1.72; zFT = 1.35; zBT = 0.15; zBB = 0.12;
              g.add(roundedBox(1.86, 0.84, 1.85, M(0xdbe2ea, { r: 0.35, m: 0.3, b: 'metal' }), 0, 1.0, -1.05, 0.08));
            }
            g.add(makeSlopedCabin(1.68, cabH, zFB, zFT, zBT, zBB, body));

            // Боковое остекление, дверные ручки и молдинги
            const winLen = Math.max(0.75, (zFT - zBT) * 0.92);
            const winCenterZ = (zFT + zBT) * 0.5;
            for (const sx of [-1, 1]) {
              g.add(roundedBox(0.05, cabH * 0.66, winLen, sideWindowMat, sx * 0.83, 0.92 + cabH * 0.52, winCenterZ, 0.02));
              g.add(box(0.05, 0.04, 0.22, chromeMat, sx * 0.98, 0.78, 0.15, false));
              g.add(box(0.05, 0.05, 2.5, chromeMat, sx * 0.98, 0.44, 0, false));
            }
            if (type.name === 'Внедорожник' || type.name === 'Премиум-кроссовер') {
              for (const sx of [-0.52, 0.52]) g.add(box(0.06, 0.06, 1.8, chromeMat, sx, 0.94 + cabH, winCenterZ, false));
            }
            if (type.name === 'Купе') {
              g.add(box(1.48, 0.06, 0.26, trimDarkMat, 0, 1.04, -1.86, false));
              for (const sx of [-0.45, 0.45]) g.add(box(0.06, 0.14, 0.08, trimDarkMat, sx, 0.95, -1.86, false));
            }

            // Лобовое стекло точно по наклону передних стоек
            const dxW = zFB - zFT, dyW = cabH;
            const wsLen = Math.hypot(dxW, dyW) + 0.06;
            const wsAngle = -Math.atan2(dxW, dyW);
            const wsY = 0.91 + dyW * 0.52;
            const wsZ = (zFB + zFT) * 0.5 + 0.04;

            const ws = new THREE.Mesh(
              new THREE.PlaneGeometry(1.48, wsLen),
              new THREE.MeshPhysicalMaterial({ map: crackTex, roughness: 0.08, metalness: 0.05, clearcoat: 1.0, envMap, envMapIntensity: 1.25 })
            );
            ws.position.set(0, wsY, wsZ);
            ws.rotation.x = wsAngle;
            g.add(ws);

            // Дворники у основания лобового стекла
            for (const sx of [-0.32, 0.28]) {
              const wiper = box(0.52, 0.025, 0.03, trimDarkMat, sx, 0.94, zFB + 0.04, false);
              wiper.rotation.y = 0.08; g.add(wiper);
            }

            // 3D-эффекты ремонта и тонировки
            const fxGroup = new THREE.Group();
            fxGroup.position.set(0, wsY + 0.03, wsZ + 0.04);
            fxGroup.rotation.x = wsAngle;
            fxGroup.visible = false;
            const uvTool = new THREE.Group();
            uvTool.add(box(0.24, 0.08, 0.12, steelBeamMat, 0, 0, 0.05, false));
            const uvGlowMat = new THREE.MeshBasicMaterial({ color: 0xc084fc, transparent: true, opacity: 0.88 });
            const uvBulb = new THREE.Mesh(new THREE.SphereGeometry(0.13, 12, 10), uvGlowMat);
            uvBulb.position.set(0, 0, 0.08);
            uvTool.add(uvBulb);
            const squeegee = box(0.44, 0.16, 0.04, M(0xfacc15, { r: 0.25 }), 0, 0, 0.03, false);
            fxGroup.add(uvTool, squeegee);
            g.add(fxGroup);

            // Заднее стекло
            if (type.name !== 'Грузовик') {
              const dxR = zBT - zBB, dyR = cabH;
              const rw = new THREE.Mesh(new THREE.PlaneGeometry(1.42, Math.hypot(dxR, dyR)), sideWindowMat);
              rw.position.set(0, 0.91 + dyR * 0.52, (zBT + zBB) * 0.5 - 0.04);
              rw.rotation.y = Math.PI;
              rw.rotation.x = -Math.atan2(dxR, dyR);
              g.add(rw);
            }

            // Колеса с тормозными дисками и спицами
            for (const sx of [-1, 1]) for (const sz of [-1.35, 1.35]) {
              const w = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.32, 24), tireMat);
              w.rotation.z = Math.PI / 2; w.position.set(sx * 0.96, 0.4, sz); w.castShadow = true; g.add(w);
              const brake = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.26, 16), M(0x64748b, { r: 0.35, m: 0.8 }));
              brake.rotation.z = Math.PI / 2; brake.position.copy(w.position); g.add(brake);
              const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.335, 18), chromeMat);
              rim.rotation.z = Math.PI / 2; rim.position.copy(w.position); g.add(rim);
              const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.35, 12), trimDarkMat);
              hub.rotation.z = Math.PI / 2; hub.position.copy(w.position); g.add(hub);
              for (let k = 0; k < 5; k++) {
                const spoke = box(0.03, 0.24, 0.045, chromeMat, sx * 0.96, 0.4, sz, false);
                spoke.rotation.x = k * Math.PI / 5; g.add(spoke);
              }
            }

            // Бамперы, решетка радиатора, зеркала и номерные знаки
            g.add(roundedBox(1.88, 0.2, 0.22, trimDarkMat, 0, 0.34, 2.08, 0.05, false));
            g.add(roundedBox(1.88, 0.2, 0.22, trimDarkMat, 0, 0.34, -2.08, 0.05, false));
            g.add(box(0.88, 0.24, 0.06, trimDarkMat, 0, 0.64, 2.13, false));
            g.add(box(0.92, 0.04, 0.07, chromeMat, 0, 0.68, 2.14, false));
            g.add(box(0.46, 0.12, 0.06, M(0xf8fafc, { r: 0.3 }), 0, 0.38, 2.16, false));
            g.add(box(0.46, 0.12, 0.06, M(0xf8fafc, { r: 0.3 }), 0, 0.38, -2.16, false));

            for (const sx of [-1, 1]) {
              g.add(roundedBox(0.22, 0.14, 0.18, body, sx * 1.0, 1.08, zFB - 0.12, 0.04));
            }

            // Фары с линзами и задние светодиодные фонари
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff0b3, emissiveIntensity: 1.0, roughness: 0.1 });
            const tailMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xff1e1e, emissiveIntensity: 0.35, roughness: 0.2 });
            g.add(roundedBox(0.42, 0.16, 0.08, headMat, -0.64, 0.68, 2.11, 0.03, false));
            g.add(roundedBox(0.42, 0.16, 0.08, headMat, 0.64, 0.68, 2.11, 0.03, false));
            g.add(roundedBox(0.44, 0.15, 0.08, tailMat, -0.64, 0.72, -2.11, 0.03, false));
            g.add(roundedBox(0.44, 0.15, 0.08, tailMat, 0.64, 0.72, -2.11, 0.03, false));

            g.scale.set(type.s[0], type.s[1], type.s[2]);
            scene.add(g);
            return { obj: g, ws, wsBaseY: wsY, wsBaseZ: wsZ, wsBaseRot: wsAngle, fxGroup, uvTool, uvBulb, squeegee, headMat, tailMat };
          }

          function disposeCar(car) {
            if (!car) return;
            if (car.sticker && car.sticker.tex) car.sticker.tex.dispose();
            car.obj.traverse(node => {
              if (node.geometry && (!node.geometry.userData || !node.geometry.userData.shared)) {
                node.geometry.dispose();
              }
              if (node.material) {
                const mats = Array.isArray(node.material) ? node.material : [node.material];
                for (const m of mats) {
                  if (m && (!m.userData || !m.userData.shared)) {
                    if (m.map && (!m.map.userData || !m.map.userData.shared)) m.map.dispose();
                    m.dispose();
                  }
                }
              }
            });
            scene.remove(car.obj);
          }

          function drawStickerCanvas(canvas, serviceKey, mood, ratio) {
            const svc = SERVICES[serviceKey] || SERVICES.repair;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = mood === 'angry' ? '#b83232' : mood === 'worry' ? '#bd7b16' : mood === 'happy' ? '#18794e' : '#131e2e';
            ctx.beginPath(); ctx.roundRect(8, 8, 496, 156, 34); ctx.fill();
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 7; ctx.stroke();
            ctx.font = 'bold 54px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            const icon = mood === 'angry' ? '😡' : mood === 'worry' ? '😟' : mood === 'happy' ? '😊' : svc.icon;
            ctx.fillText(icon, 70, 74);
            ctx.font = '900 36px system-ui'; ctx.textAlign = 'left'; ctx.fillStyle = '#ffffff';
            const labelText = mood === 'angry' ? 'НЕДОВОЛЕН' : mood === 'worry' ? 'ЖДЁТ' : mood === 'happy' ? 'ДОВОЛЕН' : svc.label;
            ctx.fillText(labelText, 122, 74);
            if (mood !== 'happy') {
              ctx.fillStyle = 'rgba(0,0,0,0.48)';
              ctx.beginPath(); ctx.roundRect(36, 126, 440, 18, 9); ctx.fill();
              const r = Math.max(0, Math.min(1, ratio));
              ctx.fillStyle = r > 0.62 ? '#48bb78' : r > 0.28 ? '#ffd166' : '#ff5252';
              ctx.beginPath(); ctx.roundRect(36, 126, Math.max(16, 440 * r), 18, 9); ctx.fill();
            }
          }

          function serviceSticker(serviceKey, mood = 'service', ratio = 1) {
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 172;
            drawStickerCanvas(canvas, serviceKey, mood, ratio);
            const tex = new THREE.CanvasTexture(canvas); tex.colorSpace = THREE.SRGBColorSpace;
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
            sprite.scale.set(3.25, 1.1, 1); sprite.position.set(0, 3.55, 0); sprite.renderOrder = 20;
            return { sprite, tex, canvas, mood, step: Math.round(ratio * 20) };
          }

          function updateCarSticker(car) {
            if (!car || !car.sticker) return;
            const ratio = car.maxPatience > 0 ? car.patience / car.maxPatience : 1;
            const mood = car.mood === 'happy' ? 'happy' : ratio < 0.28 ? 'angry' : ratio < 0.62 ? 'worry' : 'service';
            const step = Math.round(ratio * 20);
            if (mood !== car.mood || step !== car.sticker.step) {
              const prevMood = car.mood;
              car.mood = mood;
              car.sticker.mood = mood;
              car.sticker.step = step;
              drawStickerCanvas(car.sticker.canvas, car.service, mood, ratio);
              car.sticker.tex.needsUpdate = true;
              if (mood !== prevMood) {
                if (mood === 'angry') sfx('warning'); else if (mood === 'happy') sfx('happy');
              }
            }
          }

          function updateCarWorkVisual(car, progress, nowSec) {
            if (!car) return;
            if (progress <= 0.001) {
              car.fxGroup.visible = false;
              car.ws.position.set(0, car.wsBaseY, car.wsBaseZ);
              car.ws.rotation.x = car.wsBaseRot;
              return;
            }
            if (car.service === 'replacement') {
              car.fxGroup.visible = false;
              if (progress < 0.5) {
                const k = progress * 2;
                car.ws.material.map = crackTex;
                car.ws.position.y = car.wsBaseY + k * 0.65;
                car.ws.position.z = car.wsBaseZ + k * 0.25;
                car.ws.rotation.x = car.wsBaseRot - k * 0.35;
              } else {
                const k = (1 - progress) * 2;
                car.ws.material.map = cleanTex;
                car.ws.position.y = car.wsBaseY + k * 0.65;
                car.ws.position.z = car.wsBaseZ + k * 0.25;
                car.ws.rotation.x = car.wsBaseRot - k * 0.25;
              }
              car.ws.material.needsUpdate = true;
            } else if (car.service === 'repair') {
              car.fxGroup.visible = true;
              car.uvTool.visible = true;
              car.squeegee.visible = false;
              car.uvTool.position.set(Math.sin(nowSec * 5) * 0.28, Math.cos(nowSec * 3.5) * 0.12, 0.04);
              car.uvBulb.scale.setScalar(0.85 + Math.sin(nowSec * 16) * 0.22);
            } else if (car.service === 'tint') {
              car.fxGroup.visible = true;
              car.uvTool.visible = false;
              car.squeegee.visible = true;
              car.squeegee.position.set(Math.sin(nowSec * 7) * 0.45, (0.5 - progress) * 0.5, 0.03);
              car.ws.material.color.setRGB(1 - progress * 0.68, 1 - progress * 0.58, 1 - progress * 0.5);
            }
          }

          function updateToolHud() {
            const names = { replacement: 'Замена стекла', repair: 'Ремонтный набор', tint: 'Плёнка для тонировки' };
            const cap = playerCap();
            document.querySelectorAll('.toolBtn').forEach(b => b.classList.toggle('active', b.dataset.tool === selectedTool));
            const el = document.getElementById('toolStatus');
            if (el) el.innerHTML = `Инструмент: ${names[selectedTool]}<small>Склад: ${player.glass}/${cap} стекол · ${player.supplies.repair}/${cap} наборов · ${player.supplies.tint}/${cap} плёнок</small>`;
          }
          document.querySelectorAll('.toolBtn').forEach(btn => btn.addEventListener('click', () => { selectedTool = btn.dataset.tool; updateToolHud(); sfx('click'); }));

          function spawnCar(b) {
            const lvl = save.unlocked.length;
            const pool = CAR_TYPES.filter(t => t.need <= lvl);
            const type = pool[Math.floor(Math.random() * pool.length)];
            const c = makeCar(type, CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)]);
            const service = SERVICE_KEYS[Math.floor(Math.random() * SERVICE_KEYS.length)];
            if (service === 'tint') { c.ws.material.map = cleanTex; c.ws.material.needsUpdate = true; }
            const maxP = Math.max(28, 48 + save.reputation * 0.12 - save.cars * 0.15);
            const car = {
              ...c, type, service, bay: b, state: 'arrive',
              patience: maxP, maxPatience: maxP,
              path: [{ x: ROAD_X, z: -2 }, { x: ROAD_X, z: LANE_Z }, { x: b.x, z: LANE_Z }, { x: b.x, z: CAR_Z }],
              pi: 0, rot: Math.PI, sticker: null, mood: 'service', jobStarted: false
            };
            car.sticker = serviceSticker(service, 'service', 1);
            car.obj.add(car.sticker.sprite);
            car.obj.position.set(ROAD_X, 0, 16); car.obj.rotation.y = Math.PI;
            b.car = car; b.mechPrep = 0; cars.push(car);
          }

          function moveCar(car, dt) {
            const p = car.path[car.pi]; if (!p) return true;
            car.tailMat.emissiveIntensity = p.rev ? 1.5 : 0.3;
            car.headMat.emissiveIntensity = car.state === 'arrive' ? 1.2 : 0.65;
            const o = car.obj.position, dx = p.x - o.x, dz = p.z - o.z, d = Math.hypot(dx, dz);
            const sp = 10 * dt;
            if (d < sp) { o.x = p.x; o.z = p.z; car.pi++; return car.pi >= car.path.length; }
            o.x += dx / d * sp; o.z += dz / d * sp;
            let target = Math.atan2(dx, dz); if (p.rev) target += Math.PI;
            let diff = target - car.obj.rotation.y; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
            car.obj.rotation.y += diff * Math.min(1, dt * 8);
            return false;
          }

          // ================== Деньги на кассе ==================
          const pile = [];
          function pilePos(i) {
            const layer = Math.floor(i / 8), k = i % 8, c = k % 4, r = Math.floor(k / 4);
            return new THREE.Vector3(8.6 + c * 0.6, 1.15 + layer * 0.13, 6.75 + r * 0.42);
          }
          function addPile(v, from) {
            const m = new THREE.Mesh(moneyGeo, moneyMat); m.castShadow = true;
            const idx = pile.length; pile.push({ mesh: m, v });
            scene.add(m);
            const to = pilePos(Math.min(idx, 47));
            fly(m, from.clone(), () => to, 0.6, () => { m.position.copy(to); if (idx >= 48) m.visible = false; }, false);
          }

          // ================== Летающие предметы ==================
          const flyers = [];
          function fly(mesh, from, toFn, dur, done, remove = true) {
            if (!mesh.parent) scene.add(mesh);
            mesh.position.copy(from);
            flyers.push({ mesh, from, toFn, t: 0, dur, done, remove });
          }
          function updateFlyers(dt) {
            for (let i = flyers.length - 1; i >= 0; i--) {
              const f = flyers[i]; f.t += dt / f.dur;
              const to = f.toFn(), k = Math.min(1, f.t);
              f.mesh.position.lerpVectors(f.from, to, k);
              f.mesh.position.y += Math.sin(k * Math.PI) * 1.5;
              f.mesh.rotation.y += dt * 8;
              if (f.t >= 1) {
                if (f.remove) scene.remove(f.mesh);
                f.done && f.done(); flyers.splice(i, 1);
              }
            }
          }
          const pops = [];
          function popup(text, pos, color) {
            const d = document.createElement('div'); d.className = 'pop'; d.textContent = text;
            if (color) d.style.color = color;
            document.body.appendChild(d); pops.push({ d, pos: pos.clone(), t: 0 });
          }
          function updatePops(dt) {
            const v = new THREE.Vector3();
            for (let i = pops.length - 1; i >= 0; i--) {
              const p = pops[i]; p.t += dt;
              v.copy(p.pos); v.y += 2.5 + p.t * 1.5; v.project(camera);
              p.d.style.left = ((v.x + 1) / 2 * innerWidth) + 'px';
              p.d.style.top = ((1 - v.y) / 2 * innerHeight) + 'px';
              p.d.style.opacity = String(Math.max(0, 1 - p.t / 1.2));
              if (p.t > 1.2) { p.d.remove(); pops.splice(i, 1); }
            }
          }

          // ================== Зоны покупки ==================
          function zoneTex(z) {
            const paid = save.paid[z.id] || 0, left = z.cost - paid;
            return canvasTex(256, 256, (g, W, H) => {
              g.fillStyle = 'rgba(15,23,42,0.68)'; g.beginPath(); g.roundRect(8, 8, W - 16, H - 16, 24); g.fill();
              if (paid > 0) {
                g.fillStyle = 'rgba(34,197,94,0.78)';
                const h = (H - 16) * paid / z.cost;
                g.fillRect(8, H - 8 - h, W - 16, h);
              }
              g.setLineDash([22, 14]); g.lineWidth = 8; g.strokeStyle = '#f8fafc'; g.strokeRect(12, 12, W - 24, H - 24);
              g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
              g.font = '800 38px system-ui,Roboto,sans-serif'; g.fillText(z.name, W / 2, 92);
              g.fillStyle = '#ffd166'; g.font = '900 54px system-ui,Roboto,sans-serif'; g.fillText(left + ' ₽', W / 2, 162);
            });
          }
          const zoneMeshes = {};
          function refreshZone(z) {
            let m = zoneMeshes[z.id];
            const tex = zoneTex(z);
            if (!m) {
              m = flat(2.2, 2.2, new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }), z.x, 0.07, z.z);
              scene.add(m); zoneMeshes[z.id] = m;
            } else { m.material.map.dispose(); m.material.map = tex; m.material.needsUpdate = true; }
          }
          const zoneVisible = z => !has(z.id) && z.req.every(has);
          function syncZones() {
            for (const z of ZONES) {
              const vis = zoneVisible(z);
              if (vis && !zoneMeshes[z.id]) refreshZone(z);
              if (!vis && zoneMeshes[z.id]) { scene.remove(zoneMeshes[z.id]); delete zoneMeshes[z.id]; }
            }
          }

          // ================== Работники ==================
          const loaders = [];
          let cashier = null;
          function applyUnlock(id, silent) {
            if (id === 'bay2') openBay(bays[1]);
            if (id === 'bay3') openBay(bays[2]);
            if (id.startsWith('loader')) {
              const o = makePerson(0x1d4ed8, 0x1e293b, 0x1e40af, 1 + loaders.length); o.position.set(WARE.x + 1, 0, 5);
              loaders.push({ obj: o, glass: 0, stack: [], state: 'toWare', target: null, t: 0 });
            }
            if (id.startsWith('mech')) {
              const b = bays[+id.slice(4) - 1];
              const o = makePerson(0x334155, 0x0f172a, 0xd97706, 2 + (+id.slice(4))); o.position.set(b.x - 1.1, 0, WORK_Z - 0.7); o.rotation.y = Math.PI * 0.8;
              b.mech = { obj: o };
            }
            if (id === 'cashier') {
              const o = makePerson(0x0f766e, 0x1e293b, null, 4); o.position.set(9.5, 0, 8.1); o.rotation.y = Math.PI;
              cashier = { obj: o, t: 0 };
            }
            if (!silent) {
              const z = ZONES.find(z => z.id === id);
              popup('Открыто: ' + z.name, new THREE.Vector3(z.x, 0, z.z), '#7CFC9A');
              showToast('🏗️', z.name + ' открыт!', 'Мастерская стала больше. Новые возможности доступны.', 'unlock');
              vibrate(60);
            }
          }
          openBay(bays[0]);
          save.unlocked.forEach(id => applyUnlock(id, true));
          syncZones();

          function walkTo(o, tx, tz, speed, dt) {
            const p = o.position, dx = tx - p.x, dz = tz - p.z, d = Math.hypot(dx, dz);
            if (d < 0.08) { animateWalk(o, false, dt); return true; }
            const s = Math.min(d, speed * dt);
            p.x += dx / d * s; p.z += dz / d * s;
            o.rotation.y = Math.atan2(dx, dz);
            animateWalk(o, true, dt);
            return d < 0.15;
          }
          function bayNeed(b) { return b.open ? (b.car ? 2 : 0) + (3 - b.stand) * 0.5 - (b.stand >= 3 ? 99 : 0) - loaders.filter(l => l.target === b).length * 1.5 : -99; }
          function updateLoader(L, dt) {
            const sp = 3.6 * staffMul();
            L.t -= dt;
            if (L.state === 'toWare') {
              if (walkTo(L.obj, WARE.x + 0.4, WARE.z - 0.3, sp, dt)) L.state = 'load';
            } else if (L.state === 'load') {
              animateWalk(L.obj, false, dt);
              const anyNeed = bays.some(b => bayNeed(b) > 0);
