          }
          function animateWalk(p, moving, dt) {
            const u = p.userData;
            if (moving) u.walk += dt * 12; else u.walk *= 0.8;
            const s = Math.sin(u.walk) * (moving ? 0.6 : 0);
            u.legL.rotation.x = s; u.legR.rotation.x = -s;
          }
          function updateStack(p, stack, count) {
            while (stack.length < count) {
              const m = new THREE.Mesh(glassGeo, glassMat); m.castShadow = true;
              m.position.set(0, 1.05 + stack.length * 0.1, 0.62); p.add(m); stack.push(m);
            }
            while (stack.length > count) p.remove(stack.pop());
          }

