name: Build Steklo APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract game archive and write updated vertical files
        shell: bash
        run: |
          mkdir -p game
          if [ -f "steklo-v3.1-graphics.zip" ]; then
            ZIP_FILE="steklo-v3.1-graphics.zip"
          else
            ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)"
          fi
          unzip -o "$ZIP_FILE" -d game
          PROJECT_DIR="$(find game -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ОШИБКА: не найден settings.gradle"
            exit 1
          fi
          mkdir -p "$PROJECT_DIR/app/src/main/assets"
          mkdir -p "$PROJECT_DIR/app/src/main/java/ru/steklo/game"
          
          # Записываем MainActivity.java с жесткой фиксацией портретного режима
          cat << 'EOF_JAVA' > "$PROJECT_DIR/app/src/main/java/ru/steklo/game/MainActivity.java"
          package ru.steklo.game;
          import android.app.Activity;
          import android.content.Context;
          import android.content.pm.ActivityInfo;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              private WebView web;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_PORTRAIT);

                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  web.addJavascriptInterface(new AndroidBridge(this), "AndroidBridge");
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  web.setBackgroundColor(0xFFdcae7d);
                  setContentView(web);
                  hideBars();
                  web.loadUrl("file:///android_asset/index.html");
              }
              public static class AndroidBridge {
                  private final Context ctx;
                  public AndroidBridge(Context ctx) { this.ctx = ctx; }
                  @JavascriptInterface
                  public void vibrate(int ms) {
                      try {
                          Vibrator v = (Vibrator) ctx.getSystemService(Context.VIBRATOR_SERVICE);
                          if (v != null && v.hasVibrator()) {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  v.vibrate(VibrationEffect.createOneShot(Math.max(10, ms), VibrationEffect.DEFAULT_AMPLITUDE));
                              } else {
                                  v.vibrate(Math.max(10, ms));
                              }
                          }
                      } catch (Throwable ignored) {}
                  }
              }
              private void hideBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              }
              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideBars();
              }
              @Override
              public void onBackPressed() {
                  if (web != null) {
                      web.evaluateJavascript("window.onBack ? window.onBack() : 'exit'", value -> {
                          if (value != null && value.contains("exit")) finish();
                      });
                  } else {
                      super.onBackPressed();
                  }
              }
              @Override protected void onPause() { super.onPause(); if (web != null) web.onPause(); }
              @Override protected void onResume() { super.onResume(); if (web != null) web.onResume(); }
              @Override protected void onDestroy() {
                  if (web != null) { web.loadUrl("about:blank"); web.destroy(); web = null; }
                  super.onDestroy();
              }
          }
          EOF_JAVA

          # Записываем вертикальный красивый index.html
          cat << 'EOF_HTML' > "$PROJECT_DIR/app/src/main/assets/index.html"
          <!doctype html>
          <html lang="ru">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
          <title>Автостёкла Тайкун 3D</title>
          <style>
          html,body{margin:0;height:100%;overflow:hidden;background:#dcae7d;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,Roboto,sans-serif}
          canvas{display:block}
          #hud{position:fixed;left:0;right:0;top:0;padding:16px 16px 0;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:5}
          .badge{background:rgba(30,35,45,0.9);color:#ffd166;font-weight:900;font-size:18px;padding:10px 18px;border-radius:24px;box-shadow:0 4px 16px rgba(0,0,0,0.3)}
          #upBtn{pointer-events:auto;background:linear-gradient(135deg,#ffaa00,#ff7700);color:#fff;border:0;font-weight:900;font-size:16px;padding:12px 22px;border-radius:24px;box-shadow:0 6px 0 #b35200,0 8px 20px rgba(0,0,0,0.35);cursor:pointer;transition:transform 0.1s}
          #upBtn:active{transform:scale(0.94);box-shadow:0 2px 0 #b35200}
          #toolPanel{position:fixed;right:16px;bottom:24px;z-index:7;display:flex;flex-direction:column;gap:12px;pointer-events:auto}
          .toolBtn{border:none;border-radius:20px;background:rgba(40,48,60,0.94);color:#fff;padding:14px 18px;font-size:15px;font-weight:900;box-shadow:0 6px 0 rgba(0,0,0,0.4),0 8px 20px rgba(0,0,0,0.25);white-space:nowrap;cursor:pointer;transition:transform 0.1s,background 0.1s}
          .toolBtn.active{background:linear-gradient(135deg,#2ecc71,#27ae60);box-shadow:0 6px 0 #1e8449,0 8px 20px rgba(0,0,0,0.25);transform:scale(1.06)}
          #toolStatus{position:fixed;left:16px;bottom:24px;z-index:7;background:rgba(30,35,45,0.92);color:#fff;border-radius:18px;padding:12px 16px;font-size:14px;font-weight:800;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,0.3)}
          #toolStatus small{display:block;color:#a0aec0;font-weight:600;margin-top:3px}
          #joy{position:fixed;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:rgba(255,255,255,0.18);border:3px solid rgba(255,255,255,0.6);display:none;pointer-events:none;z-index:6}
          #knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,0.95);box-shadow:0 4px 10px rgba(0,0,0,0.3)}
          #panel{position:fixed;inset:0;background:rgba(15,20,30,0.75);display:none;align-items:center;justify-content:center;z-index:10}
          #panel .box{background:#232d3f;border-radius:26px;padding:22px;width:min(90vw,380px);color:#fff;box-shadow:0 12px 40px rgba(0,0,0,0.5)}
          #panel h2{margin:0 0 14px;font-size:22px;text-align:center;color:#ffd166}
          .up{display:flex;align-items:center;gap:12px;background:#2c384c;border-radius:16px;padding:12px;margin-bottom:10px}
          .up .t{flex:1}.up .n{font-weight:900;font-size:15px}.up .d{font-size:12px;color:#a0aec0;margin-top:2px}
          .up button{border:0;border-radius:14px;padding:10px 14px;font-weight:900;font-size:14px;background:#ffd166;color:#1b2330;box-shadow:0 4px 0 #b38f00;cursor:pointer}
          #close{display:block;width:100%;margin-top:12px;border:0;border-radius:16px;padding:14px;font-weight:900;font-size:16px;background:#4a5568;color:#fff;cursor:pointer}
          </style>
          </head>
          <body>
          <div id="hud">
            <div class="badge" id="money">0 ₽</div>
            <button id="upBtn">⬆ Развитие</button>
          </div>
          <div id="joy"><div id="knob"></div></div>
          <div id="toolStatus">Инструмент: Замена<small>Склад: 0/3 стекол</small></div>
          <div id="toolPanel">
            <button class="toolBtn active" data-tool="replacement">🪟 Замена</button>
            <button class="toolBtn" data-tool="repair">🛠 Ремонт</button>
            <button class="toolBtn" data-tool="tint">🎞 Тонировка</button>
          </div>
          <div id="panel">
            <div class="box">
              <h2>Развитие мастерской</h2>
              <div id="ups">
                <div class="up"><div class="t"><div class="n">Кроссовки</div><div class="d">Скорость бега</div></div><button>60 ₽</button></div>
              </div>
              <button id="close">Закрыть</button>
            </div>
          </div>
          <script src="three.min.js"></script>
          <script>
          'use strict';
          const WARE = { x: -3.2, z: 4.5 };
          const CASH = { x: 3.2, z: 4.5 };
          const BAY_Z = -3.0;
          let save = { money: 0, glass: 0 };
          try { const s = JSON.parse(localStorage.getItem('steklo_v4') || 'null'); if (s) save = Object.assign(save, s); } catch (e) {}
          const renderer = new THREE.WebGLRenderer({ antialias: true });
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
          renderer.shadowMap.enabled = true;
          renderer.shadowMap.type = THREE.PCFSoftShadowMap;
          renderer.outputColorSpace = THREE.SRGBColorSpace;
          document.body.appendChild(renderer.domElement);
          const scene = new THREE.Scene();
          scene.background = new THREE.Color(0xdcae7d);
          scene.fog = new THREE.Fog(0xdcae7d, 22, 55);
          const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 100);
          scene.add(new THREE.HemisphereLight(0xfff3e0, 0x543d2b, 1.3));
          const sun = new THREE.DirectionalLight(0xfffaed, 2.0);
          sun.castShadow = true;
          sun.shadow.mapSize.set(2048, 2048);
          Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 35 });
          sun.shadow.bias = -0.0008;
          scene.add(sun);
          const M = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.75, metalness: 0.05 });
          const box = (w, h, d, mat, x=0, y=0, z=0) => {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
          };
          box(40, 0.2, 40, M(0xc29b68), 0, -0.1, 0);
          box(10, 0.25, 14, M(0x525e71), 0, 0, 0);
          box(2.2, 0.9, 1.2, M(0x3e4c59), WARE.x, 0.45, WARE.z);
          box(2.2, 1.0, 1.2, M(0x8d5a3b), CASH.x, 0.5, CASH.z);
          const playerGroup = new THREE.Group();
          const bodyM = M(0x2b6cb0), skinM = M(0xf6ad55), pantsM = M(0x2d3748), capM = M(0xdd6b20);
          const torso = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.55, 0.22), bodyM); torso.position.y = 0.52; torso.castShadow = true;
          const head = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.28, 0.28), skinM); head.position.y = 0.94; head.castShadow = true;
          const cap = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 0.32), capM); cap.position.set(0, 1.1, 0.02);
          const legs = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.35, 0.2), pantsM); legs.position.y = 0.2; legs.castShadow = true;
          playerGroup.add(torso, head, cap, legs);
          playerGroup.position.set(0, 0, 2);
          scene.add(playerGroup);
          const carGroup = new THREE.Group();
          const carBody = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.65, 3.0), M(0x319795)); carBody.position.y = 0.45; carBody.castShadow = true;
          const carCabin = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.5, 1.5), M(0x1a365d)); carCabin.position.set(0, 0.95, -0.2); carCabin.castShadow = true;
          carGroup.add(carBody, carCabin);
          carGroup.position.set(0, 0, BAY_Z);
          scene.add(carGroup);
          let joy = { on: false, id: null, ox: 0, oy: 0, dx: 0, dy: 0 };
          const joyEl = document.getElementById('joy'), knob = document.getElementById('knob');
          renderer.domElement.addEventListener('pointerdown', e => {
            if (joy.on) return;
            joy.on = true; joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.dx = joy.dy = 0;
            joyEl.style.left = e.clientX + 'px'; joyEl.style.top = e.clientY + 'px'; joyEl.style.display = 'block';
            knob.style.transform = 'translate(0,0)';
          });
          addEventListener('pointermove', e => {
            if (!joy.on || e.pointerId !== joy.id) return;
            let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy, d = Math.hypot(dx, dy), R = 55;
            if (d > R) { dx = dx / d * R; dy = dy / d * R; }
            joy.dx = dx / R; joy.dy = dy / R;
            knob.style.transform = `translate(${dx}px,${dy}px)`;
          });
          const joyEnd = e => { if (e.pointerId !== joy.id) return; joy.on = false; joy.dx = joy.dy = 0; joyEl.style.display = 'none'; };
          addEventListener('pointerup', joyEnd); addEventListener('pointercancel', joyEnd);
          document.querySelectorAll('.toolBtn').forEach(btn => btn.addEventListener('click', e => {
            document.querySelectorAll('.toolBtn').forEach(b => b.classList.remove('active'));
            e.currentTarget.classList.add('active');
            const names = { replacement: 'Замена', repair: 'Ремонт', tint: 'Тонировка' };
            document.getElementById('toolStatus').innerHTML = `Инструмент: ${names[e.currentTarget.dataset.tool]}<small>Склад: ${save.glass}/3 стекол</small>`;
          }));
          const panel = document.getElementById('panel');
          document.getElementById('upBtn').addEventListener('click', () => panel.style.display = 'flex');
          document.getElementById('close').addEventListener('click', () => panel.style.display = 'none');
          function resize() {
            renderer.setSize(innerWidth, innerHeight);
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
          }
          addEventListener('resize', resize); resize();
          let last = performance.now();
          function frame(now) {
            const dt = Math.min(0.05, (now - last) / 1000); last = now;
            if (Math.hypot(joy.dx, joy.dy) > 0.1) {
              const sp = 4.8 * dt;
              playerGroup.position.x += joy.dx * sp;
              playerGroup.position.z += joy.dy * sp;
              playerGroup.rotation.y = Math.atan2(joy.dx, joy.dy);
            }
            playerGroup.position.x = Math.max(-5, Math.min(5, playerGroup.position.x));
            playerGroup.position.z = Math.max(-5, Math.min(6, playerGroup.position.z));
            camera
