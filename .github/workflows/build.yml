          canvas{display:block}
          #vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 58%,rgba(6,10,18,0.42) 100%)}
          #toolPanel{position:fixed;right:12px;bottom:14px;z-index:7;display:flex;flex-direction:column;gap:7px;pointer-events:auto;max-width:34vw}
          .toolBtn{border:1px solid rgba(255,255,255,.25);border-radius:14px;background:linear-gradient(145deg,rgba(22,32,46,.95),rgba(13,20,30,.95));color:#fff;padding:10px 13px;font-size:13px;font-weight:850;box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.15);white-space:nowrap;transition:transform .14s,background .14s,border-color .14s;backdrop-filter:blur(6px)}
          .toolBtn.active{background:linear-gradient(145deg,#ffb703,#fb8500);color:#111822;border-color:#ffe699;transform:translateX(-4px);box-shadow:0 6px 18px rgba(251,133,0,.45),inset 0 1px 0 rgba(255,255,255,.6)}
          #toolStatus{position:fixed;left:12px;bottom:12px;z-index:7;background:linear-gradient(145deg,rgba(20,29,41,.92),rgba(12,18,28,.92));color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:9px 12px;font-size:12px;font-weight:800;pointer-events:none;max-width:52vw;box-shadow:0 6px 18px rgba(0,0,0,.35);backdrop-filter:blur(6px)}
          #toolStatus small{display:block;color:#b9c5d3;font-weight:600;margin-top:3px}
          @media (orientation:landscape){#hud{padding:8px 10px 0}#money{font-size:19px;padding:6px 13px}#rank{font-size:11px;padding:6px 9px;margin-top:5px}#repCard{font-size:10px;padding:5px 8px}#upBtn{font-size:14px;padding:8px 13px}#hint{top:10px;font-size:13px;max-width:42vw;overflow:hidden;text-overflow:ellipsis}#toolPanel{right:10px;bottom:10px;gap:5px}.toolBtn{font-size:12px;padding:7px 9px}#toolStatus{left:10px;bottom:10px}}
          #hud{position:fixed;left:0;right:0;top:0;padding:12px 12px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
