            const earL = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10), skin);
            const earR = earL.clone(); earL.position.set(-0.32, 1.66, 0); earR.position.set(0.32, 1.66, 0);
            earL.scale.set(0.6, 1, 0.55); earR.scale.copy(earL.scale);

            const eyeWhite = M(0xffffff, { r: 0.15 }), iris = M(st.eyes, { r: 0.2 }), pupil = M(0x0f172a, { r: 0.1 });
            for (const x of [-0.115, 0.115]) {
              const eye = new THREE.Mesh(new THREE.SphereGeometry(0.072, 14, 12), eyeWhite);
              eye.position.set(x, 1.69, 0.28); eye.scale.set(1, 1.1, 0.48); g.add(eye);
              const ir = new THREE.Mesh(new THREE.SphereGeometry(0.044, 12, 10), iris);
              ir.position.set(x, 1.685, 0.315); g.add(ir);
              const pu = new THREE.Mesh(new THREE.SphereGeometry(0.024, 10, 8), pupil);
              pu.position.set(x, 1.685, 0.332); g.add(pu);
