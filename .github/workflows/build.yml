          #rank small{color:#b9c5d3;font-weight:600}
          #repCard{background:linear-gradient(145deg,rgba(20,28,40,.92),rgba(12,18,28,.92));color:#fff;font-size:12px;font-weight:800;padding:7px 11px;border-radius:13px;margin-top:5px;min-width:130px;border:1px solid rgba(255,255,255,.12);box-shadow:0 4px 12px rgba(0,0,0,.3)}
