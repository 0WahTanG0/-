name: Build Steklo APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install unzip and python3-pil
        run: sudo apt-get update && sudo apt-get install -y unzip python3-pil

      - name: Extract archive, generate icon, banner and game code
        shell: bash
        run: |
          mkdir -p game
          if [ -f "steklo-v3.1-graphics.zip" ]; then
            ZIP_FILE="steklo-v3.1-graphics.zip"
          else
            ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)"
          fi
          unzip -o "$ZIP_FILE" -d game
          PROJECT_DIR="$(find game -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ОШИБКА: не найден settings.gradle"
            exit 1
          fi

          mkdir -p "$PROJECT_DIR/app/src/main/assets"
          mkdir -p "$PROJECT_DIR/app/src/main/java/ru/steklo/game"
          mkdir -p "$PROJECT_DIR/app/src/main/res/drawable-nodpi"

          # 1. Генерируем иконку (из фото 1) и баннер АВТОСТЕКЛА.РФ (из фото 2), а также меняем имя приложения на АВТОСТЕКЛА
          export PROJECT_DIR="$PROJECT_DIR"
          python3 - << 'EOF_PY'
          import os, re, random
          from PIL import Image, ImageDraw, ImageChops, ImageFont

          proj = os.environ["PROJECT_DIR"]
          icon_out = os.path.join(proj, "app/src/main/res/drawable-nodpi/ic_launcher.png")
          logo_out = os.path.join(proj, "app/src/main/assets/logo.png")

          def draw_emblem(size=512):
              img = Image.new("RGBA", (size, size), (0, 0, 0, 255))
              s = size / 512.0
              poly = [(int(x*s), int(y*s)) for x, y in [
                  (184, 96), (218, 96), (328, 336), (328, 430),
                  (224, 464), (192, 464), (124, 326), (122, 184)
              ]]
              shard_mask = Image.new("L", (size, size), 0)
              ImageDraw.Draw(shard_mask).polygon(poly, fill=255)

              car_mask = Image.new("L", (size, size), 0)
              dc = ImageDraw.Draw(car_mask)
              dc.polygon([(int(x*s), int(y*s)) for x, y in [
                  (170, 232), (198, 166), (314, 166), (342, 232)
              ]], fill=255)
              dc.rounded_rectangle([int(164*s), int(222*s), int(348*s), int(306*s)], radius=int(26*s), fill=255)
              dc.rounded_rectangle([int(168*s), int(276*s), int(196*s), int(336*s)], radius=int(13*s), fill=255)
              dc.rounded_rectangle([int(316*s), int(276*s), int(344*s), int(336*s)], radius=int(13*s), fill=255)
              dc.polygon([(int(x*s), int(y*s)) for x, y in [
                  (194, 224), (208, 184), (304, 184), (318, 224)
              ]], fill=0)
              r_hl = int(13*s)
              dc.ellipse([int(200*s)-r_hl, int(258*s)-r_hl, int(200*s)+r_hl, int(258*s)+r_hl], fill=0)
              dc.ellipse([int(312*s)-r_hl, int(258*s)-r_hl, int(312*s)+r_hl, int(258*s)+r_hl], fill=0)
              dc.rounded_rectangle([int(230*s), int(250*s), int(282*s), int(266*s)], radius=int(8*s), fill=0)

              inv_car = ImageChops.invert(car_mask)
              left_part = ImageChops.multiply(shard_mask, inv_car)
              inv_shard = ImageChops.invert(shard_mask)
              right_part = ImageChops.multiply(inv_shard, car_mask)
              combined = ImageChops.lighter(left_part, right_part)

              # Диагональный разрез
              ImageDraw.Draw(combined).line([(int(214*s), int(92*s)), (int(332*s), int(342*s))], fill=0, width=max(2, int(4*s)))

              white = Image.new("RGBA", (size, size), (255, 255, 255, 255))
              img.paste(white, (0, 0), combined)
              return img

          # Если пользователь положил 1000035271.jpg в репо — используем его, иначе генерируем точную копию
          if os.path.exists("1000035271.jpg"):
              ic = Image.open("1000035271.jpg").convert("RGBA")
              w, h = ic.size
              m = min(w, h)
              ic = ic.crop(((w-m)//2, (h-m)//2, (w+m)//2, (h+m)//2)).resize((512, 512), Image.LANCZOS)
          else:
              ic = draw_emblem(512)
          ic.save(icon_out, "PNG")

          # Генерируем горизонтальный баннер АВТОСТЕКЛА.РФ для вывески в игре (1024x256)
          if os.path.exists("1000035270.jpg"):
              src = Image.open("1000035270.jpg").convert("RGBA")
              sw, sh = src.size
              crop_h = int(sw * 0.25)
              banner = src.crop((0, (sh - crop_h)//2, sw, (sh + crop_h)//2)).resize((1024, 256), Image.LANCZOS)
          else:
              banner = Image.new("RGBA", (1024, 256), (10, 12, 16, 255))
              em = draw_emblem(220)
              banner.paste(em, (24, 18), em)
              db = ImageDraw.Draw(banner)
              font = None
              for fp in [
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  "/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf"
              ]:
                  if os.path.exists(fp):
                      font = ImageFont.truetype(fp, 74)
                      break
              db.text((248, 72), "АВТОСТЕКЛА.РФ", font=font, fill=(255, 255, 255, 255))
              # Гранж-эффект потертости букв и линия с точками снизу как на фото 2
              random.seed(42)
              for _ in range(950):
                  rx = random.randint(245, 985)
                  ry = random.randint(68, 155)
                  rr = random.randint(1, 3)
                  db.ellipse([rx-rr, ry-rr, rx+rr, ry+rr], fill=(10, 12, 16, 255))
              db.line([(250, 174), (565, 174)], fill=(255, 255, 255, 235), width=3)
              for dx in [-32, -16, 0, 16, 32]:
                  r = 4 if dx == 0 else 3
                  db.ellipse([615+dx-r, 174-r, 615+dx+r, 174+r], fill=(255, 255, 255, 255))
              db.line([(665, 174), (980, 174)], fill=(255, 255, 255, 235), width=3)

          banner.save(logo_out, "PNG")

          # Обновляем название приложения в AndroidManifest.xml и strings.xml на "АВТОСТЕКЛА"
          manifest_path = os.path.join(proj, "app/src/main/AndroidManifest.xml")
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  txt = f.read()
              txt = re.sub(r'android:label="[^"]*"', 'android:label="АВТОСТЕКЛА"', txt)
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(txt)

          strings_path = os.path.join(proj, "app/src/main/res/values/strings.xml")
          if os.path.exists(strings_path):
              with open(strings_path, "r", encoding="utf-8") as f:
                  stxt = f.read()
              stxt = re.sub(r'>[^<]*</string>', '>АВТОСТЕКЛА</string>', stxt)
              with open(strings_path, "w", encoding="utf-8") as f:
                  f.write(stxt)
          EOF_PY

          # 2. Записываем MainActivity.java
          cat << 'EOF_JAVA' > "$PROJECT_DIR/app/src/main/java/ru/steklo/game/MainActivity.java"
          package ru.steklo.game;
          import android.app.Activity;
          import android.content.Context;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              private WebView web;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  web.addJavascriptInterface(new AndroidBridge(this), "AndroidBridge");
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  web.setBackgroundColor(0xFF4FC3F7);
                  setContentView(web);
                  hideBars();
                  web.loadUrl("file:///android_asset/index.html");
              }
              public static class AndroidBridge {
                  private final Context ctx;
                  public AndroidBridge(Context ctx) {
                      this.ctx = ctx;
                  }
                  @JavascriptInterface
                  public void vibrate(int ms) {
                      try {
                          Vibrator v = (Vibrator) ctx.getSystemService(Context.VIBRATOR_SERVICE);
                          if (v != null && v.hasVibrator()) {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  v.vibrate(VibrationEffect.createOneShot(Math.max(10, ms), VibrationEffect.DEFAULT_AMPLITUDE));
                              } else {
                                  v.vibrate(Math.max(10, ms));
                              }
                          }
                      } catch (Throwable ignored) {
                      }
                  }
              }
              private void hideBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              }
              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideBars();
              }
              @Override
              public void onBackPressed() {
                  if (web != null) {
                      web.evaluateJavascript("window.onBack ? window.onBack() : 'exit'", value -> {
                          if (value != null && value.contains("exit")) finish();
                      });
                  } else {
                      super.onBackPressed();
                  }
              }
              @Override
              protected void onPause() {
                  super.onPause();
                  if (web != null) web.onPause();
              }
              @Override
              protected void onResume() {
                  super.onResume();
                  if (web != null) web.onResume();
              }
              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.loadUrl("about:blank");
                      web.destroy();
                      web = null;
                  }
                  super.onDestroy();
              }
          }
          EOF_JAVA

          # 3. Записываем обновленный яркий index.html с точным прилеганием всех стекол и деталей
          cat << 'EOF_HTML' > "$PROJECT_DIR/app/src/main/assets/index.html"
          <!doctype html>
          <html lang="ru">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
          <title>АВТОСТЕКЛА · 4.0</title>
          <style>
          html,body{margin:0;height:100%;overflow:hidden;background:#4fc3f7;touch-action:none;
            user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
            font-family:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif}
          canvas{display:block}
          #toolPanel{position:fixed;right:12px;bottom:14px;z-index:7;display:flex;flex-direction:column;gap:8px;pointer-events:auto;max-width:36vw}
          .toolBtn{border:2px solid #ffffffaa;border-radius:16px;background:linear-gradient(180deg,#25364d,#182436);color:#fff;padding:10px 14px;font-size:13px;font-weight:900;box-shadow:0 4px 0 #0d1520,0 6px 14px rgba(0,0,0,.25);white-space:nowrap;transition:transform .12s,background .12s}
          .toolBtn.active{background:linear-gradient(180deg,#ffca28,#ff9800);color:#141e28;border-color:#fff;transform:translateX(-4px) scale(1.03);box-shadow:0 4px 0 #c66900,0 6px 16px rgba(255,152,0,.45)}
          #toolStatus{position:fixed;left:12px;bottom:12px;z-index:7;background:rgba(20,32,48,.92);color:#fff;border:2px solid #ffffff44;border-radius:16px;padding:9px 13px;font-size:12px;font-weight:800;pointer-events:none;max-width:52vw;box-shadow:0 6px 16px rgba(0,0,0,.22)}
          #toolStatus small{display:block;color:#90caf9;font-weight:700;margin-top:3px}
          @media (orientation:landscape){#hud{padding:8px 10px 0}#money{font-size:19px;padding:6px 13px}#rank{font-size:11px;padding:6px 9px;margin-top:5px}#repCard{font-size:10px;padding:5px 8px}#upBtn{font-size:14px;padding:8px 13px}#hint{top:10px;font-size:13px;max-width:42vw;overflow:hidden;text-overflow:ellipsis}#toolPanel{right:10px;bottom:10px;gap:5px}.toolBtn{font-size:12px;padding:7px 9px}#toolStatus{left:10px;bottom:10px}}
          #hud{position:fixed;left:0;right:0;top:0;padding:12px 12px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
          #money{background:linear-gradient(180deg,#1e2f44,#142030);color:#ffdf5d;font-weight:900;font-size:23px;padding:8px 18px;border-radius:24px;min-width:90px;border:2px solid #ffffff33;box-shadow:0 4px 12px rgba(0,0,0,.22)}
          #rank{background:rgba(20,32,48,.9);color:#fff;font-weight:800;font-size:13px;padding:8px 12px;border-radius:16px;margin-top:7px;min-width:135px;border:1px solid #ffffff28;box-shadow:0 4px 10px rgba(0,0,0,.18)}
          #rank .bar{height:7px;background:#32455c;border-radius:8px;margin-top:6px;overflow:hidden}
          #rankFill{height:100%;width:0;background:linear-gradient(90deg,#ff9800,#ffee58);border-radius:8px}
          #rank small{color:#b3e5fc;font-weight:700}
          #repCard{background:rgba(20,32,48,.9);color:#fff;font-size:12px;font-weight:800;padding:7px 11px;border-radius:14px;margin-top:5px;min-width:135px;border:1px solid #ffffff28;box-shadow:0 4px 10px rgba(0,0,0,.18)}
          #repCard .bar{height:6px;background:#32455c;border-radius:8px;margin-top:5px;overflow:hidden}
          #repFill{height:100%;width:50%;background:linear-gradient(90deg,#ff5252,#ffca28,#00e676);border-radius:8px}
          #comboBadge{display:none;background:linear-gradient(90deg,#ff6d00,#ffd600);color:#141e28;font-size:11px;font-weight:900;padding:5px 10px;border-radius:10px;margin-top:5px;box-shadow:0 3px 10px rgba(255,109,0,.4)}
          #progressCard{background:#1e2b3c;border:1px solid #3b526e;border-radius:14px;padding:12px;margin-bottom:12px}
          #progressCard .big{font-size:18px;font-weight:900;color:#ffd54f}
          #progressCard .muted{font-size:13px;color:#b0bec5;line-height:1.45;margin-top:5px}
          #progressCard .contract{margin-top:9px;padding:9px;background:#26374d;border-radius:10px;font-size:13px;line-height:1.4}
          #upBtn{pointer-events:auto;background:linear-gradient(180deg,#ffca28,#ff9800);color:#141e28;border:2px solid #fff;font-weight:900;font-size:16px;padding:10px 18px;border-radius:24px;box-shadow:0 4px 0 #c66900,0 6px 14px rgba(0,0,0,.25)}
          #hint{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:rgba(20,32,48,.88);color:#fff;font-weight:800;font-size:15px;padding:8px 18px;border-radius:18px;border:1px solid #ffffff33;white-space:nowrap;pointer-events:none;z-index:5;transition:opacity .3s}
          #joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.24);border:3px solid rgba(255,255,255,.7);display:none;pointer-events:none;z-index:6}
          #knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:#ffffff;box-shadow:0 3px 8px rgba(0,0,0,.3)}
          .pop{position:fixed;font-weight:900;font-size:23px;color:#ffe047;text-shadow:0 2px 0 #7a5000,0 0 8px rgba(0,0,0,.45);pointer-events:none;z-index:4;transform:translate(-50%,-50%);white-space:nowrap}
          #panel{position:fixed;inset:0;background:rgba(10,18,28,.65);display:none;align-items:center;justify-content:center;z-index:10}
          #panel .box{background:#182434;border:2px solid #39506b;border-radius:22px;padding:18px;width:min(92vw,400px);color:#fff;max-height:88vh;overflow:auto}
          #panel h2{margin:0 0 12px;font-size:22px;text-align:center;color:#ffca28}
          .up{display:flex;align-items:center;gap:10px;background:#243449;border-radius:14px;padding:10px 12px;margin-bottom:10px}
          .up .t{flex:1}.up .n{font-weight:800;font-size:16px}.up .d{font-size:13px;color:#b0bec5;margin-top:2px}
          .up .lv{font-size:12px;color:#00e676;margin-top:4px}
          .up button{border:0;border-radius:12px;padding:10px 12px;font-weight:900;font-size:15px;background:linear-gradient(180deg,#ffca28,#ff9800);color:#141e28;min-width:84px;transition:transform .12s,filter .12s}
          .up button:active{transform:scale(.95);filter:brightness(1.15)}
          .up button.no{background:#455a64;color:#90a4ae}
          #close{display:block;width:100%;margin-top:6px;border:0;border-radius:14px;padding:12px;font-weight:800;font-size:16px;background:#455a64;color:#fff}
          #reset{display:block;width:100%;margin-top:8px;border:0;background:none;color:#78909c;font-size:13px;padding:6px}
          #toast{position:fixed;left:50%;top:28%;transform:translate(-50%,-12px) scale(.92);opacity:0;pointer-events:none;z-index:20;background:linear-gradient(135deg,#1b2a3d,#2b425e);border:2px solid #ffca28;color:#fff;border-radius:18px;padding:14px 20px;text-align:center;min-width:190px;max-width:82vw;box-shadow:0 12px 36px #0008;transition:opacity .22s,transform .22s}
          #toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
          #toast .icon{font-size:30px;display:block;margin-bottom:4px}
          #toast .title{font-weight:900;font-size:18px;color:#ffd54f}
          #toast .sub{font-size:13px;color:#e2e8f0;margin-top:4px}
          </style>
          </head>
          <body>
          <div id="hud">
            <div>
              <div id="money">0 ₽</div>
              <div id="rank">
                <div id="rankTitle">Уровень 1 · Новичок</div>
                <small id="rankXp">0 / 100 опыта</small>
                <div class="bar"><div id="rankFill"></div></div>
              </div>
              <div id="repCard"><span id="repText">Репутация мастерской · 50/100</span><div class="bar"><div id="repFill"></div></div></div>
              <div id="comboBadge">🔥 Быстрый сервис ×2</div>
            </div>
            <button id="upBtn">⬆ Развитие</button>
          </div>
          <div id="hint"></div>
          <div id="toast" role="status" aria-live="polite"><span class="icon">🔧</span><div class="title">Улучшение</div><div class="sub"></div></div>
          <div id="joy"><div id="knob"></div></div>
          <div id="toolStatus">Инструмент: Замена стекла<small>Склад: 0/3 стекол · 0/3 наборов · 0/3 плёнок</small></div>
          <div id="toolPanel">
            <button class="toolBtn active" data-tool="replacement">🪟 Замена</button>
            <button class="toolBtn" data-tool="repair">🛠 Ремонт</button>
            <button class="toolBtn" data-tool="tint">🎞 Тонировка</button>
          </div>
          <div id="panel">
            <div class="box">
              <h2>АВТОСТЕКЛА · Развитие</h2>
              <div id="progressCard"></div>
              <div id="ups"></div>
              <button id="soundBtn" style="display:block;width:100%;margin-top:8px;border:0;border-radius:14px;padding:11px;font-weight:800;background:#354a63;color:#fff">🔊 Звуки: включены</button>
              <button id="close">Закрыть</button>
              <button id="reset">Начать заново</button>
            </div>
          </div>
          <script src="three.min.js"></script>
          <script>
          'use strict';
          // ================== Константы мира ==================
          const BAYX = [-2, 4, 10];
          const CAR_Z = -7.4;
          const WORK_Z = -3.5;
          const LANE_Z = -14;
          const ROAD_X = -10;
          const WARE = { x: -4, z: 6.0 };
          const CASH = { x: 9.5, z: 5.3 };
          const BOUNDS = { x0: -6.4, x1: 15.4, z0: -4.7, z1: 10.2 };

          const CAR_TYPES = [
            { name: 'Хэтчбек', price: 40, s: [1, 1, 0.95], need: 0 },
            { name: 'Седан', price: 60, s: [1, 1, 1.06], need: 1 },
            { name: 'Универсал', price: 75, s: [1.02, 1.05, 1.12], need: 2 },
            { name: 'Внедорожник', price: 90, s: [1.08, 1.18, 1.08], need: 3 },
            { name: 'Купе', price: 105, s: [1.04, 0.94, 1.02], need: 4 },
            { name: 'Премиум-кроссовер', price: 125, s: [1.12, 1.22, 1.12], need: 5 },
            { name: 'Пикап', price: 140, s: [1.14, 1.26, 1.16], need: 6 },
          ];
          // Сочные аркадные цвета кузовов (как в современных мобильных хитах)
          const CAR_COLORS = [
            0xff3b30, 0x007aff, 0xffcc00, 0x34c759, 0xaf52de,
            0xff9500, 0x00c7be, 0xff2d55, 0x5856d6, 0xffffff
          ];
          const SERVICES = {
            replacement: { label: 'ЗАМЕНА', icon: '🪟', tool: 'replacement', price: 1.45, name: 'Замена лобового' },
            repair: { label: 'РЕМОНТ', icon: '🛠', tool: 'repair', price: 1, name: 'Ремонт стекла' },
            tint: { label: 'ТОНИРОВКА', icon: '🎞', tool: 'tint', price: 1.2, name: 'Тонировка' }
          };
          const SERVICE_KEYS = Object.keys(SERVICES);
          let selectedTool = 'replacement';
          let fastStreak = 0;

          const ZONES = [
