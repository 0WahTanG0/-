name: Build Steklo APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'steklo-v3.0.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract game archive
        run: |
          mkdir -p game
          unzip -o steklo-v3.0.zip -d game
          echo "Содержимое архива:"
          find game -maxdepth 4 -type f | head -100

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Android project
        run: |
          echo "Ищем build.gradle:"
          find game -name build.gradle -o -name build.gradle.kts

          PROJECT_DIR=$(find game -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ОШИБКА: не найден Android-проект"
            exit 1
          fi

          echo "PROJECT_DIR
