          #upBtn{pointer-events:auto;background:linear-gradient(135deg,#f59e0b,#d97706);color:#111827;border:2px solid #fde68a;font-weight:900;font-size:16px;padding:12px 22px;border-radius:24px;box-shadow:0 6px 0 #92400e,0 8px 20px rgba(0,0,0,0.4);transition:transform .1s}
