            roughness: 0.75, metalness: 0.05
          });
          const hazardStripeMat = new THREE.MeshStandardMaterial({ map: TEX.hazardMap, roughness: 0.45, metalness: 0.1 });

          const bays = BAYX.map((x, i) => {
            const progMat = new THREE.MeshBasicMaterial({ color: 0x22c55e, transparent: true, opacity: 0.95, depthWrite: false, side: THREE.DoubleSide });
            const b = {
              i, x, open: false, car: null, stand: 0, incoming: 0, standMeshes: [],
              progress: 0, lastProgRender: 0, cool: 0.5 + i, mech: null, mechPrep: 0,
              ring: null, prog: null, progMat, jobReady: false
            };
            b.floor = flat(5.6, 6.2, bayClosedMat, x, 0.03, -7.6); scene.add(b.floor);
            for (const dx of [-2.45, 2.45]) scene.add(flat(0.24, 5.9, hazardStripeMat, x + dx, 0.038, -7.6));
            // Металлическая дренажная решетка под машиной
            scene.add(flat(1.4, 3.8, M(0x1e293b, { r: 0.3, m: 0.85, b: 'metal', bs: 0.02 }), x, 0.036, -7.5));
            const st = new THREE.Group(); st.position.set(x + 1.7, 0, -4.4);
            st.add(
