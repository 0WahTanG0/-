name: Build Steklo APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'steklo-v2.5.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract game archive
        run: |
          unzip -o steklo-v2.5.zip -d game

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd game/steklo-main
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Steklo-APK
          path: game/steklo-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
