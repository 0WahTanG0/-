            }

            // Касса
            tick.cash -= dt;
            if (tick.cash < -0.15) tick.cash = -0.15;
            while (pile.length && inCircle(P, CASH.x, CASH.z, 1.4) && tick.cash <= 0) {
              tick.cash += 0.04; takeMoney(P.position);
            }
            if (cashier && pile.length) {
              cashier.t -= dt;
              if (cashier.t <= 0) { cashier.t = 0.22 / staffMul(); takeMoney(cashier.obj.position); }
            }

            // Зоны покупки
            tick.pay -= dt;
            for (const z of ZONES) {
              if (!zoneVisible(z) || !inSquare(P, z.x, z.z, 1.1)) continue;
              if (tick.pay < -0.15) tick.pay = -0.15;
              while (save.money >= 1 && tick.pay <= 0) {
                tick.pay += 0.035;
                const left = z.cost - (save.paid[z.id] || 0);
                const step = Math.min(left, Math.max(1, Math.ceil(z.cost / 45)), Math.floor(save.money));
                if (step <= 0) break;
                save.money -= step; shownMoney = Math.min(shownMoney, save.money);
                save.paid[z.id] = (save.paid[z.id] || 0) + step;
                fly(new THREE.Mesh(moneyGeo, moneyMat), P.position.clone().setY(1.6), () => v3.set(z.x, 0.1, z.z), 0.3);
                if (save.paid[z.id] >= z.cost) {
                  save.unlocked.push(z.id); delete save.paid[z.id];
                  scene.remove(zoneMeshes[z.id]); delete zoneMeshes[z.id];
                  applyUnlock(z.id, false); syncZones(); persist();
                  tick.pay = 0.6; break;
                } else refreshZone(z);
              }
            }

            loaders.forEach(L => updateLoader(L, dt));

            const ob = objective();
            tick.hint -= dt;
            if (ob && save.unlocked.length < 3) {
              arrow.visible = true; arrow.position.set(ob.x, 2.6 + Math.sin(nowSec * 5) * 0.3, ob.z);
            } else arrow.visible = false;
            if (tick.hint <= 0) {
              tick.hint = 0.3;
              const waitingCar = bays.find(b => b.open && b.car && b.car.state === 'wait');
              const txt = waitingCar ? '' : (ob && save.cars < 25 ? ob.text : '');
              hintEl.textContent = txt; hintEl.style.opacity = txt ? '1' : '0';
            }

            if (shownMoney < save.money) shownMoney = Math.min(save.money, shownMoney + Math.max(1, (save.money - shownMoney) * dt * 8));
            else shownMoney = save.money;
            updateHud();

            tick.save -= dt;
            if (tick.save <= 0) { tick.save = 5; persist(); }
          }

          function finishCar(b) {
            const car = b.car;
            setProgress(b, 0);
            updateCarWorkVisual(car, 0, 0);
            if (car.service === 'replacement') setStand(b, Math.max(0, b.stand - 1));
            b.jobReady = false; b.mechPrep = 0;

            car.ws.material.map = car.service === 'tint' ? tintTex : cleanTex;
            car.ws.material.color.set(0xffffff);
            car.ws.material.needsUpdate = true;

            const fastRatio = car.maxPatience > 0 ? car.patience / car.maxPatience : 0;
            let fastBonus = 1;
            if (fastRatio >= 0.7) { fastStreak++; fastBonus = 1.25; } else { fastStreak = 0; }

            const price = Math.round(car.type.price * SERVICES[car.service].price * priceMul() * fastBonus);
            car.mood = 'happy';
            updateCarSticker(car);

            const n = Math.min(8, Math.max(3, Math.round(price / 15))), v = Math.floor(price / n), rest = price - v * n;
            const from = car.obj.position.clone().setY(1.6);
            for (let i = 0; i < n; i++) setTimeout(() => addPile(v + (i === 0 ? rest : 0), from), i * 70);

            if (fastBonus > 1) popup(`+${price} ₽ (⚡Чаевые +25%)`, car.obj.position, '#ffea00');
            else popup('+' + price + ' ₽', car.obj.position);

            sfx('cash');
            save.cars++;
            changeReputation(fastBonus > 1 ? 3 : 2);
            save.xp = (save.xp || 0) + (fastBonus > 1 ? 35 : 30);

            let leveled = false;
            while (save.xp >= xpForNextLevel()) {
              save.level++;
              const bonus = 100 + save.level * 50;
              save.money += bonus;
              popup('УРОВЕНЬ ' + save.level + '! +' + bonus + ' ₽', new THREE.Vector3(car.obj.position.x, 2.8, car.obj.position.z), '#00e676');
              showToast('🏆', 'Новый уровень!', `${rankName(save.level)} · бонус ${bonus} ₽`, 'level');
              leveled = true;
            }
            if (save.cars > 0 && save.cars % 5 === 0 && save.contractClaimed < save.cars / 5) {
              save.contractClaimed = save.cars / 5;
              const reward = 120 + save.level * 30;
              save.money += reward;
              popup('ЗАКАЗ НЕДЕЛИ +' + reward + ' ₽', new THREE.Vector3(car.obj.position.x, 3.4, car.obj.position.z), '#ffea00');
            }
            if (leveled && panelOpen) renderPanel();
            persist(); updateHud(); if (panelOpen) renderPanel();
            car.state = 'leave';
            car.path = [{ x: b.x, z: LANE_Z, rev: true }, { x: 30, z: LANE_Z }]; car.pi = 0;
            b.car = null; b.jobReady = false; b.cool = Math.max(1.2, 4.5 - save.reputation * 0.025) + Math.random() * 1.5;
            vibrate(35);
          }

          function customerLeaves(b, car) {
            fastStreak = 0;
            setProgress(b, 0);
            updateCarWorkVisual(car, 0, 0);
            changeReputation(-8);
            popup('Клиент уехал! Репутация −8', new THREE.Vector3(car.obj.position.x, 3.0, car.obj.position.z), '#ff5252');
            sfx('warning');
            car.state = 'leave';
            car.path = [{ x: b.x, z: LANE_Z, rev: true }, { x: 30, z: LANE_Z }];
            car.pi = 0;
            b.car = null; b.jobReady = false; b.mechPrep = 0; b.cool = 2.5 + Math.random() * 2;
            persist(); updateHud(); if (panelOpen) renderPanel(); vibrate(90);
          }

          function takeMoney(to) {
            const item = pile.pop(); if (!item) return;
            save.money += item.v;
            const m = item.mesh; m.visible = true;
            const fi = flyers.findIndex(f => f.mesh === m); if (fi >= 0) flyers.splice(fi, 1);
            fly(m, m.position.clone(), () => v3.copy(to).setY(1.4), 0.25);
          }

          function resize() {
            renderer.setSize(innerWidth, innerHeight);
            camera.aspect = innerWidth / innerHeight;
            camera.fov = camera.aspect < 1.1 ? 56 : 44;
            camera.updateProjectionMatrix();
          }
          addEventListener('resize', resize); resize();
          const camPos = new THREE.Vector3();
          function updateCamera(dt, snap) {
            const p = player.obj.position;
            const k = camera.aspect < 1.1 ? 1.42 : 1.25;
            const tx = p.x + 2.5 * k, ty = 15 * k, tz = p.z + 11 * k;
            if (snap) camPos.set(tx, ty, tz); else camPos.lerp(v3.set(tx, ty, tz), Math.min(1, dt * 5));
            camera.position.copy(camPos);
            camera.lookAt(camPos.x - 2.5 * k, 0, camPos.z - 11 * k);
            sun.position.set(p.x + 10, 22, p.z + 8); sun.target.position.set(p.x, 0, p.z);
          }
          updateCamera(0, true);

          let last = performance.now();
          const TIME_SCALE = +(new URLSearchParams(location.search).get('ts') || 1);
          function frame(now) {
            const dt = Math.min(0.05, (now - last) / 1000) * TIME_SCALE; last = now;
            if (!panelOpen) update(dt);
            updateFlyers(dt);
            updateCamera(dt);
            renderer.render(scene, camera);
            updatePops(dt);
            requestAnimationFrame(frame);
          }
          updateHud(true); updateToolHud();
          requestAnimationFrame(frame);
          document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });
          window.__game = { save, player, bays, cars, pile, loaders };
          </script>
          </body>
          </html>
          EOF_HTML

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          ls -lh "$PROJECT_DIR/app/src/main/res/drawable-nodpi/ic_launcher.png" "$PROJECT_DIR/app/src/main/assets/logo.png" "$PROJECT_DIR/app/src/main/assets/index.html"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          if [ -n "$ANDROID_HOME" ] && [ ! -f "local.properties" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi
          if [ -f "gradle.properties" ] && ! grep -q "android.useAndroidX" gradle.properties; then
            echo "" >> gradle.properties
            echo "android.useAndroidX=true" >> gradle.properties
          fi
          gradle clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Avtostekla-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
