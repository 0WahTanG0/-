          #repCard{background:rgba(20,26,36,.88);color:#fff;font-size:12px;font-weight:800;padding:7px 11px;border-radius:13px;margin-top:5px;min-width:130px;box-shadow:0 2px 8px #0003}
          #repCard .bar{height:5px;background:#3a4658;border-radius:8px;margin-top:5px;overflow:hidden}
          #repFill{height:100%;width:50%;background:linear-gradient(90deg,#e05252,#ffd166,#48bb78);border-radius:8px}
          #comboBadge{display:none;background:linear-gradient(90deg,#f07818,#ffd166);color:#17202b;font-size:11px;font-weight:900;padding:4px 10px;border-radius:10px;margin-top:5px;box-shadow:0 2px 8px #0004}
          #progressCard{background:#202b3a;border:1px solid #3b4b61;border-radius:14px;padding:12px;margin-bottom:12px}
          #progressCard .big{font-size:18px;font-weight:900;color:#ffd166}
          #progressCard .muted{font-size:13px;color:#bdc7d5;line-height:1.45;margin-top:5px}
          #progressCard .contract{margin-top:9px;padding:9px;background:#2b394c;border-radius:10px;font-size:13px;line-height:1.4}
          #upBtn{pointer-events:auto;background:#f0a500;color:#1b2330;border:0;font-weight:800;font-size:16px;padding:10px 16px;border-radius:24px;box-shadow:0 3px 0 #a87300}
          #hint{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:rgba(20,26,36,.75);color:#fff;font-weight:700;font-size:15px;padding:8px 16px;border-radius:18px;white-space:nowrap;pointer-events:none;z-index:5;transition:opacity .3s}
          #joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.5);display:none;pointer-events:none;z-index:6}
          #knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.85)}
          .pop{position:fixed;font-weight:900;font-size:22px;color:#ffd166;text-shadow:0 2px 0 #6b4b00,0 0 6px rgba(0,0,0,.4);pointer-events:none;z-index:4;transform:translate(-50%,-50%);white-space:nowrap}
          #panel{position:fixed;inset:0;background:rgba(10,14,22,.6);display:none;align-items:center;justify-content:center;z-index:10}
          #panel .box{background:#1f2836;border-radius:20px;padding:18px;width:min(92vw,400px);color:#fff;max-height:88vh;overflow:auto}
          #panel h2{margin:0 0 12px;font-size:22px;text-align:center;color:#f0a500}
          .up{display:flex;align-items:center;gap:10px;background:#2a3446;border-radius:14px;padding:10px 12px;margin-bottom:10px}
          .up .t{flex:1}.up .n{font-weight:800;font-size:16px}.up .d{font-size:13px;color:#a0aec0;margin-top:2px}
          .up .lv{font-size:12px;color:#48bb78;margin-top:4px}
          .up button{border:0;border-radius:12px;padding:10px 12px;font-weight:800;font-size:15px;background:#f0a500;color:#1b2330;min-width:84px;transition:transform .12s,filter .12s}
          .up button:active{transform:scale(.95);filter:brightness(1.15)}
          .up button.no{background:#4a5568;color:#a0aec0}
          #close{display:block;width:100%;margin-top:6px;border:0;border-radius:14px;padding:12px;font-weight:800;font-size:16px;background:#4a5568;color:#fff}
          #reset{display:block;width:100%;margin-top:8px;border:0;background:none;color:#718096;font-size:13px;padding:6px}
          #toast{position:fixed;left:50%;top:28%;transform:translate(-50%,-12px) scale(.92);opacity:0;pointer-events:none;z-index:20;background:linear-gradient(135deg,#202b3a,#34465c);border:2px solid #f0a500;color:#fff;border-radius:18px;padding:14px 20px;text-align:center;min-width:190px;max-width:82vw;box-shadow:0 12px 36px #0008;transition:opacity .22s,transform .22s}
          #toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
          #toast .icon{font-size:30px;display:block;margin-bottom:4px}
          #toast .title{font-weight:900;font-size:18px;color:#ffd166}
          #toast .sub{font-size:13px;color:#e2e8f0;margin-top:4px}
          #toast.pulse{animation:toastPulse .55s ease-out}
          #toast.kind-building{border-color:#56c8f2;animation:buildingReveal .7s cubic-bezier(.2,.9,.25,1.2)}
          #toast.kind-level{border-color:#ffe08a;animation:levelReveal .8s cubic-bezier(.2,.9,.25,1.2)}
          #toast.kind-tool{border-color:#72d7a1;animation:toolReveal .45s ease-out}
          #toast.kind-job{border-color:#8ac7ff;animation:jobReveal .55s ease-out}
          @keyframes toastPulse{0%{box-shadow:0 0 0 0 #f0a50099}100%{box-shadow:0 0 0 22px #f0a50000}}
          @keyframes buildingReveal{0%{transform:translate(-50%,30px) scale(.45) rotate(-5deg);filter:brightness(1.8)}70%{transform:translate(-50%,-4px) scale(1.06)}100%{transform:translate(-50%,0) scale(1)}}
          @keyframes levelReveal{0%{transform:translate(-50%,-25px) scale(.6);filter:brightness(2)}55%{transform:translate(-50%,0) scale(1.12)}100%{transform:translate(-50%,0) scale(1)}}
          @keyframes toolReveal{0%{transform:translate(-50%,0) scale(.65) rotate(4deg)}60%{transform:translate(-50%,0) scale(1.08) rotate(-2deg)}100%{transform:translate(-50%,0) scale(1)}}
          @keyframes jobReveal{0%{transform:translate(-50%,12px) scale(.8);opacity:0}100%{transform:translate(-50%,0) scale(1);opacity:1}}
          </style>
          </head>
          <body>
          <div id="hud">
            <div>
              <div id="money">0 ₽</div>
              <div id="rank">
                <div id="rankTitle">Уровень 1 · Новичок</div>
                <small id="rankXp">0 / 100 опыта</small>
                <div class="bar"><div id="rankFill"></div></div>
              </div>
              <div id="repCard"><span id="repText">Репутация мастерской · 50/100</span><div class="bar"><div id="repFill"></div></div></div>
              <div id="comboBadge">🔥 Серия быстрого сервиса ×2</div>
            </div>
            <button id="upBtn">⬆ Развитие</button>
          </div>
          <div id="hint"></div>
          <div id="toast" role="status" aria-live="polite"><span class="icon">🔧</span><div class="title">Улучшение</div><div class="sub"></div></div>
          <div id="joy"><div id="knob"></div></div>
          <div id="toolStatus">Инструмент: Замена стекла<small>Склад: 0/3 стекол · 0/3 наборов · 0/3 плёнок</small></div>
          <div id="toolPanel">
            <button class="toolBtn active" data-tool="replacement">🪟 Замена</button>
            <button class="toolBtn" data-tool="repair">🛠 Ремонт</button>
            <button class="toolBtn" data-tool="tint">🎞 Тонировка</button>
          </div>
          <div id="panel">
            <div class="box">
              <h2>Развитие мастерской</h2>
              <div id="progressCard"></div>
              <div id="ups"></div>
              <button id="soundBtn" style="display:block;width:100%;margin-top:8px;border:0;border-radius:14px;padding:11px;font-weight:800;background:#35445a;color:#fff">🔊 Звуки: включены</button>
              <button id="close">Закрыть</button>
              <button id="reset">Начать заново</button>
            </div>
          </div>
          <div id="vignette"></div>
          <script src="three.min.js"></script>
          <script>
          'use strict';
          const BAYX = [-2, 4, 10];
          const CAR_Z = -7.4;
          const WORK_Z = -3.5;
          const LANE_Z = -14;
          const ROAD_X = -10;
          const WARE = { x: -4, z: 6.0 };
          const CASH = { x: 9.5, z: 5.3 };
          const BOUNDS = { x0: -6.4, x1: 15.4, z0: -4.7, z1: 10.2 };
          const CAR_TYPES = [
            { name: 'Хэтчбек', price: 40, s: [1, 1, 0.95], need: 0 },
            { name: 'Седан', price: 60, s: [1, 1, 1.08], need: 1 },
            { name: 'Внедорожник', price: 90, s: [1.1, 1.25, 1.1], need: 3 },
            { name: 'Универсал', price: 75, s: [1.02, 1.08, 1.18], need: 2 },
            { name: 'Купе', price: 105, s: [1.03, 0.88, 1.02], need: 4 },
            { name: 'Премиум-кроссовер', price: 125, s: [1.16, 1.3, 1.16], need: 5 },
            { name: 'Грузовик', price: 140, s: [1.18, 1.45, 1.22], need: 6 },
          ];
          const CAR_COLORS = [0xc0392b, 0x2e86de, 0xecf0f1, 0x2d3436, 0x27ae60, 0xf39c12, 0x8e44ad, 0x7f8c8d, 0x16a085, 0xe17055];
          const SERVICES = {
            replacement: { label: 'ЗАМЕНА', icon: '🪟', tool: 'replacement', price: 1.45, name: 'Замена лобового' },
            repair: { label: 'РЕМОНТ', icon: '🛠', tool: 'repair', price: 1, name: 'Ремонт стекла' },
            tint: { label: 'ТОНИРОВКА', icon: '🎞', tool: 'tint', price: 1.2, name: 'Тонировка' }
          };
          const SERVICE_KEYS = Object.keys(SERVICES);
          let selectedTool = 'replacement';
          let fastStreak = 0;
          const ZONES = [
            { id: 'bay2', name: 'Бокс 2', cost: 150, x: 4, z: WORK_Z, req: [] },
            { id: 'loader1', name: 'Грузчик', cost: 250, x: -0.6, z: 6.6, req: ['bay2'] },
            { id: 'mech1', name: 'Мастер', cost: 350, x: -4.4, z: WORK_Z, req: ['loader1'] },
            { id: 'bay3', name: 'Бокс 3', cost: 600, x: 10, z: WORK_Z, req: ['mech1'] },
            { id: 'cashier', name: 'Кассир', cost: 500, x: 12.8, z: 5.6, req: ['bay3'] },
            { id: 'mech2', name: 'Мастер', cost: 700, x: 1.6, z: WORK_Z, req: ['cashier'] },
            { id: 'mech3', name: 'Мастер', cost: 900, x: 7.6, z: WORK_Z, req: ['mech2'] },
            { id: 'loader2', name: 'Грузчик', cost: 1000, x: 1.8, z: 6.6, req: ['mech3'] },
          ];
          const UPGS = [
            { k: 'speed', name: 'Кроссовки', desc: 'Быстрее бегаешь', base: 60, max: 5 },
            { k: 'cap', name: 'Крепкая спина', desc: '+1 к переносимым стеклам, наборам и плёнкам', base: 80, max: 5 },
            { k: 'work', name: 'Инструменты', desc: 'Быстрее замена, ремонт и тонировка', base: 100, max: 5 },
            { k: 'price', name: 'Реклама', desc: '+15% к оплате', base: 150, max: 5 },
            { k: 'staff', name: 'Обучение персонала', desc: 'Работники быстрее', base: 200, max: 5 },
          ];
          let save = { money: 0, unlocked: [], paid: {}, up: {}, cars: 0, xp: 0, level: 1, contractClaimed: 0, reputation: 50 };
          try { const s = JSON.parse(localStorage.getItem('steklo3d') || 'null'); if (s) save = Object.assign(save, s); } catch (e) {}
          UPGS.forEach(u => { if (save.up[u.k] == null) save.up[u.k] = 0; });
          if (!Number.isFinite(save.xp)) save.xp = 0;
          if (!Number.isFinite(save.level)) save.level = 1;
          if (!Number.isFinite(save.contractClaimed)) save.contractClaimed = 0;
          if (!Number.isFinite(save.reputation)) save.reputation = 50;
          save.reputation = Math.max(0, Math.min(100, save.reputation));
          function persist() { try { localStorage.setItem('steklo3d', JSON.stringify(save)); } catch (e) {} }
          const has = id => save.unlocked.includes(id);
          const playerSpeed = () => 4.2 + save.up.speed * 0.7;
          const playerCap = () => 3 + save.up.cap;
          const workTime = () => 2.6 * Math.pow(0.82, save.up.work);
          const priceMul = () => (1 + 0.15 * save.up.price) * (0.8 + save.reputation * 0.004);
          const staffMul = () => 1 + 0.2 * save.up.staff;
          const upCost = u => Math.round(u.base * Math.pow(save.up[u.k] + 1, 1.7));
          const renderer = new THREE.WebGLRenderer({ antialias: true });
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
          renderer.shadowMap.enabled = true;
          renderer.shadowMap.type = THREE.PCFSoftShadowMap;
          renderer.outputColorSpace = THREE.SRGBColorSpace;
          renderer.toneMapping = THREE.ACESFilmicToneMapping;
          renderer.toneMappingExposure = 1.12;
          document.body.appendChild(renderer.domElement);
          const scene = new THREE.Scene();
          scene.background = new THREE.Color(0x9fd0ea);
          scene.fog = new THREE.Fog(0x9fd0ea, 46, 92);
          const camera = new THREE.PerspectiveCamera(50, 1, 0.5, 200);
          function canvasTex(w, h, draw) {
            const c = document.createElement('canvas'); c.width = w; c.height = h;
            draw(c.getContext('2d'), w, h);
            const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
          }
          (function skyDome() {
            const skyTex = canvasTex(64, 256, (g, W, H) => {
              const grad = g.createLinearGradient(0, 0, 0, H);
              grad.addColorStop(0, '#5aa3d8');
              grad.addColorStop(0.45, '#9fd0ea');
              grad.addColorStop(0.78, '#cfe9f2');
              grad.addColorStop(1, '#eaf6e9');
              g.fillStyle = grad; g.fillRect(0, 0, W, H);
            });
            skyTex.wrapS = THREE.ClampToEdgeWrapping; skyTex.wrapT = THREE.ClampToEdgeWrapping;
            const sky = new THREE.Mesh(new THREE.SphereGeometry(140, 24, 16),
              new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false, depthWrite: false }));
            sky.renderOrder = -10;
            scene.add(sky);
          })();
          const pmrem = new THREE.PMREMGenerator(renderer);
          pmrem.compileEquirectangularShader();
          const envScene = new THREE.Scene();
          envScene.background = (() => {
            const t = canvasTex(16, 128, (g, W, H) => {
              const grad = g.createLinearGradient(0, 0, 0, H);
              grad.addColorStop(0, '#cfe8ff');
              grad.addColorStop(0.45, '#ffffff');
              grad.addColorStop(0.55, '#dce7d4');
              grad.addColorStop(1, '#6b8f57');
              g.fillStyle = grad; g.fillRect(0, 0, W, H);
            });
            t.mapping = THREE.EquirectangularReflectionMapping;
            return t;
          })();
          const envMap = pmrem.fromScene(envScene, 0.04).texture;
          envMap.userData = { shared: true };
          envScene.background = null;
          pmrem.dispose();
          scene.add(new THREE.HemisphereLight(0xffffff, 0x64735a, 1.0));
          const sun = new THREE.DirectionalLight(0xfff1d8, 2.1);
          sun.castShadow = true;
          sun.shadow.mapSize.set(2048, 2048);
          Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 1, far: 60 });
          sun.shadow.bias = -0.001;
          sun.shadow.radius = 2.2;
