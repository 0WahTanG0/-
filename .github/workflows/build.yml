            ];
            const st = styles[Math.abs(style) % styles.length];
            const skin = M(st.skin, { r: 0.52, m: 0.02, bs: 0.002 });
            const hair = M(st.hair, { r: 0.72, m: 0.04, b: 'fabric', bs: 0.01 });
            const shirtMat = M(shirt, { r: 0.65, m: 0.05, b: 'fabric', bs: 0.012 });
            const legM = M(pants, { r: 0.68, m: 0.05, b: 'fabric', bs: 0.012 });
            const bootM = M(0x181c22, { r: 0.35, m: 0.15 });
            const accentM = M(0xf59e0b, { r: 0.32, m: 0.25 });

            const legL = roundedBox(0.23, 0.62, 0.25, legM, -0.15, 0.3, 0, 0.05);
            const legR = roundedBox(0.23, 0.62, 0.25, legM, 0.15, 0.3, 0, 0.05);
            legL.geometry.translate(0, -0.3, 0); legR.geometry = legL.geometry;
            legL.position.y = legR.position.y = 0.6;
            const bootL = roundedBox(0.27, 0.18, 0.38, bootM, -0.15, 0.11, 0.06, 0.05);
            const bootR = roundedBox(0.27, 0.18, 0.38, bootM, 0.15, 0.11, 0.06, 0.05);

            const body = roundedBox(0.68, 0.78, 0.42, shirtMat, 0, 1.0, 0, 0.12);
            // Светоотражающая полоса спецодежды и бейдж
