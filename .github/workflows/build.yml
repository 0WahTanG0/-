name: Build Steklo APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract game archive
        shell: bash
        run: |
          mkdir -p game
          if [ -f "steklo-v3.1-graphics.zip" ]; then
            ZIP_FILE="steklo-v3.1-graphics.zip"
          else
            ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)"
          fi
          echo "Распаковка архива: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d game

          PROJECT_DIR="$(find game -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ОШИБКА: не найден settings.gradle"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Проект успешно найден в: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          if [ -n "$ANDROID_HOME" ] && [ ! -f "local.properties" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi
          if [ -f "gradle.properties" ] && ! grep -q "android.useAndroidX" gradle.properties; then
            echo "" >> gradle.properties
            echo "android.useAndroidX=true" >> gradle.properties
          fi
          gradle clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Steklo-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
