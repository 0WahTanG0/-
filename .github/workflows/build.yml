name: Build Steklo APK

on:
workflow_dispatch:
push:
paths:
- 'steklo-v2.5.zip'
- '.github/workflows/build.yml'

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Download repository
    uses: actions/checkout@v4

  - name: Extract game archive
    run: |
      unzip -o steklo-v2.5.zip -d game
      find game -maxdepth 3 -type f | head -100

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Build APK
    run: |
      cd game
      PROJECT_DIR=$(find . -name gradlew -type f -printf '%h\n' | head -1)
      if [ -z "$PROJECT_DIR" ]; then
        echo "Gradle wrapper not found"
        exit 1
      fi
      cd "$PROJECT_DIR"
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Steklo-APK
      path: game/**/build/outputs/apk/**/*.apk
      if-no-files-found: error
