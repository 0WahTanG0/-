name: Build Steklo APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract game archive and write updated game files
        shell: bash
        run: |
          mkdir -p game
          if [ -f "steklo-v3.1-graphics.zip" ]; then
            ZIP_FILE="steklo-v3.1-graphics.zip"
          else
            ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)"
          fi
          unzip -o "$ZIP_FILE" -d game
          PROJECT_DIR="$(find game -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ОШИБКА: не найден settings.gradle"
            exit 1
          fi
          mkdir -p "$PROJECT_DIR/app/src/main/assets"
          mkdir -p "$PROJECT_DIR/app/src/main/java/ru/steklo/game"
          cat << 'EOF_JAVA' > "$PROJECT_DIR/app/src/main/java/ru/steklo/game/MainActivity.java"
          package ru.steklo.game;
          import android.app.Activity;
          import android.content.Context;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              private WebView web;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  web.addJavascriptInterface(new AndroidBridge(this), "AndroidBridge");
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  web.setBackgroundColor(0xFF1B2330);
                  setContentView(web);
                  hideBars();
                  web.loadUrl("file:///android_asset/index.html");
              }
              public static class AndroidBridge {
                  private final Context ctx;
                  public AndroidBridge(Context ctx) {
                      this.ctx = ctx;
                  }
                  @JavascriptInterface
                  public void vibrate(int ms) {
                      try {
                          Vibrator v = (Vibrator) ctx.getSystemService(Context.VIBRATOR_SERVICE);
                          if (v != null && v.hasVibrator()) {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  v.vibrate(VibrationEffect.createOneShot(Math.max(10, ms), VibrationEffect.DEFAULT_AMPLITUDE));
                              } else {
                                  v.vibrate(Math.max(10, ms));
                              }
                          }
                      } catch (Throwable ignored) {
                      }
                  }
              }
              private void hideBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
              }
              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideBars();
              }
              @Override
              public void onBackPressed() {
                  if (web != null) {
                      web.evaluateJavascript("window.onBack ? window.onBack() : 'exit'", value -> {
                          if (value != null && value.contains("exit")) finish();
                      });
                  } else {
                      super.onBackPressed();
                  }
              }
              @Override
              protected void onPause() {
                  super.onPause();
                  if (web != null) web.onPause();
              }
              @Override
              protected void onResume() {
                  super.onResume();
                  if (web != null) web.onResume();
              }
              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.loadUrl("about:blank");
                      web.destroy();
                      web = null;
                  }
                  super.onDestroy();
              }
          }
          EOF_JAVA
          cat << 'EOF_HTML' > "$PROJECT_DIR/app/src/main/assets/index.html"
          <!doctype html>
          <html lang="ru">
          <head>
