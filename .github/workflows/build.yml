          // ================== Боксы ==================
          const bays = BAYX.map((x, i) => {
            const progMat = new THREE.MeshBasicMaterial({ color: 0x00e676, transparent: true, opacity: 0.95, depthWrite: false, side: THREE.DoubleSide });
            const b = {
              i, x, open: false, car: null, stand: 0, incoming: 0, standMeshes: [],
              progress: 0, lastProgRender: 0, cool: 0.5 + i, mech: null, mechPrep: 0,
              ring: null, prog: null, progMat, jobReady: false
            };
            b.floor = flat(5.6, 6.2, M(0xb0bec5), x, 0.025, -7.6); scene.add(b.floor);
            for (const dx of [-2.4, 2.4]) scene.add(flat(0.18, 5.8, M(0xffca28), x + dx, 0.032, -7.6));
            const st = new THREE.Group(); st.position.set(x + 1.7, 0, -4.4);
            st.add(box(1.1, 0.12, 0.5, M(0x37474f), 0, 0.06, 0), box(0.08, 0.9, 0.08, M(0x37474f), -0.5, 0.45, -0.2), box(0.08, 0.9, 0.08, M(0x37474f), 0.5, 0.45, -0.2));
            b.standGroup = st; st.visible = false; scene.add(st);
            return b;
          });
          function setStand(b, n) {
            b.stand = n;
            while (b.standMeshes.length < n) {
              const g = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.62, 0.06), glassMat);
              g.position.set(0, 0.45, -0.1 + b.standMeshes.length * 0.12); g.rotation.x = -0.2; g.castShadow = true;
              b.standGroup.add(g); b.standMeshes.push(g);
            }
            while (b.standMeshes.length > n) b.standGroup.remove(b.standMeshes.pop());
          }
          function openBay(b) {
            b.open = true; b.standGroup.visible = true;
            b.floor.material.color.set(0x78909c);
            b.ring = ringMesh(1.05, 1.22, 0xffffff, b.x, WORK_Z, 0.9);
          }
          function setProgress(b, p) {
            b.progress = p;
            if (p <= 0.001) {
              if (b.prog) b.prog.visible = false;
              b.lastProgRender = 0;
              return;
            }
            if (b.prog && Math.abs(p - b.lastProgRender) < 0.015 && p < 1) return;
            b.lastProgRender = p;
            const angle = -Math.PI * 2 * Math.min(1, p);
            if (!b.prog) {
              b.prog = new THREE.Mesh(new THREE.RingGeometry(0.7, 1.0, 36, 1, Math.PI / 2, angle), b.progMat);
              b.prog.rotation.x = -Math.PI / 2;
              b.prog.position.set(b.x, 0.05, WORK_Z);
              scene.add(b.prog);
            } else {
              b.prog.visible = true;
              b.prog.geometry.dispose();
              b.prog.geometry = new THREE.RingGeometry(0.7, 1.0, 36, 1, Math.PI / 2, angle);
            }
          }

          // ================== Машины: идеально подогнанные стекла на кузове ==================
          const cars = [];
          function makeCar(type, color) {
            const g = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color, roughness: 0.24, metalness: 0.08 });
            const tireMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
            const rimMat = new THREE.MeshStandardMaterial({ color: 0xeceff1, roughness: 0.25, metalness: 0.3 });
            const sideWinMat = new THREE.MeshStandardMaterial({ color: 0x263238, roughness: 0.15, metalness: 0.1 });

            contactShadow(2.5, 4.6, 0, 0, 0.018, g);

            // Основное шасси кузова: длина 4.0 (от Z = -2.0 до Z = +2.0), высота с 0.28 до 0.94
            const chassisW = 1.92, chassisH = 0.66, chassisD = 4.0, chassisY = 0.61;
            g.add(box(chassisW, chassisH, chassisD, bodyMat, 0, chassisY, 0, true));

            // Параметры кабины под каждый тип авто, чтобы стекла стояли строго на грани кабины
            let cabinW = 1.66, cabinH = 0.62, cabinD = 1.95, cabinZ = -0.15;
            if (type.name === 'Хэтчбек') { cabinD = 1.85; cabinZ = -0.25; }
            else if (type.name === 'Седан') { cabinD = 1.80; cabinZ = -0.15; }
            else if (type.name === 'Универсал') { cabinD = 2.35; cabinH = 0.64; cabinZ = -0.35; }
            else if (type.name === 'Внедорожник' || type.name === 'Премиум-кроссовер') { cabinW = 1.74; cabinH = 0.72; cabinD = 2.25; cabinZ = -0.25; }
            else if (type.name === 'Купе') { cabinW = 1.62; cabinH = 0.54; cabinD = 1.65; cabinZ = -0.10; }
            else if (type.name === 'Пикап') {
              cabinW = 1.68; cabinH = 0.70; cabinD = 1.35; cabinZ = 0.35;
              // Борта кузова пикапа сзади
              g.add(box(1.78, 0.24, 1.45, M(0x263238), 0, 0.98, -1.15, true));
            }

            const cabinY = chassisY + chassisH / 2 + cabinH / 2 - 0.02;
            g.add(box(cabinW, cabinH, cabinD, bodyMat, 0, cabinY, cabinZ, true));

            // Крыша с легким акцентом
            g.add(box(cabinW - 0.08, 0.06, cabinD - 0.12, bodyMat, 0, cabinY + cabinH / 2 + 0.01, cabinZ, false));

            // Боковые окна (строго по боковым стенкам кабины, без висящих зазоров)
            const sideWinH = cabinH * 0.62;
            const sideWinD = cabinD * 0.76;
            g.add(box(cabinW + 0.03, sideWinH, sideWinD, sideWinMat, 0, cabinY + 0.03, cabinZ, false));

            // Лобовое стекло (ТОЧНО на передней грани кабины: cabinZ + cabinD/2)
            const wsW = cabinW - 0.14;
            const wsH = cabinH * 0.84;
            const wsY = cabinY + 0.02;
            const wsZ = cabinZ + cabinD / 2 + 0.025;
            const wsMat = new THREE.MeshBasicMaterial({ map: crackTex });
            const ws = new THREE.Mesh(new THREE.BoxGeometry(wsW, wsH, 0.045), wsMat);
            ws.position.set(0, wsY, wsZ);
            ws.rotation.x = -0.18;
            g.add(ws);

            // Заднее стекло (ТОЧНО на задней грани кабины: cabinZ - cabinD/2)
            const rw = new THREE.Mesh(new THREE.BoxGeometry(wsW, wsH * 0.85, 0.04), sideWinMat);
            rw.position.set(0, wsY, cabinZ - cabinD / 2 - 0.02);
            rw.rotation.x = 0.15;
            g.add(rw);

            // 3D-инструменты работы прямо на поверхности лобового стекла
            const fxGroup = new THREE.Group();
            fxGroup.position.set(0, wsY, wsZ + 0.05);
            fxGroup.rotation.x = -0.18;
            fxGroup.visible = false;

            const uvTool = new THREE.Group();
            uvTool.add(box(0.24, 0.09, 0.12, M(0x1e293b), 0, 0, 0.04, false));
            const uvBulb = new THREE.Mesh(new THREE.SphereGeometry(0.13, 12, 10), new THREE.MeshBasicMaterial({ color: 0xd500f9 }));
            uvBulb.position.set(0, 0, 0.08);
            uvTool.add(uvBulb);

            const squeegee = box(0.46, 0.16, 0.05, M(0xffea00), 0, 0, 0.04, false);
            fxGroup.add(uvTool, squeegee);
            g.add(fxGroup);

            // Колеса и диски
            for (const sx of [-1, 1]) for (const sz of [-1.28, 1.28]) {
              const w = new THREE.Mesh(new THREE.CylinderGeometry(0.39, 0.39, 0.32, 20), tireMat);
              w.rotation.z = Math.PI / 2; w.position.set(sx * 0.96, 0.39, sz); w.castShadow = true; g.add(w);
              const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.23, 0.23, 0.34, 14), rimMat);
              rim.rotation.z = Math.PI / 2; rim.position.copy(w.position); g.add(rim);
            }

            // Бамперы, решетка радиатора, фары и стоп-сигналы (вровень с кузовом Z = ±2.02)
            g.add(box(1.86, 0.16, 0.14, M(0x263238), 0, 0.36, 2.01, false));
            g.add(box(1.86, 0.16, 0.14, M(0x263238), 0, 0.36, -2.01, false));
            g.add(box(0.76, 0.2, 0.06, M(0x1e293b), 0, 0.62, 2.01, false));

            const headMat = new THREE.MeshStandardMaterial({ color: 0xffff8d, emissive: 0xffea00, emissiveIntensity: 0.9, roughness: 0.2 });
            const tailMat = new THREE.MeshStandardMaterial({ color: 0xff1744, emissive: 0xff1744, emissiveIntensity: 0.35, roughness: 0.2 });
            g.add(box(0.4, 0.18, 0.06, headMat, -0.64, 0.68, 2.01, false), box(0.4, 0.18, 0.06, headMat, 0.64, 0.68, 2.01, false));
            g.add(box(0.4, 0.16, 0.06, tailMat, -0.64, 0.68, -2.01, false), box(0.4, 0.16, 0.06, tailMat, 0.64, 0.68, -2.01, false));

            g.scale.set(type.s[0], type.s[1], type.s[2]);
            scene.add(g);
            return { obj: g, ws, wsBaseY: wsY, wsBaseZ: wsZ, fxGroup, uvTool, uvBulb, squeegee, headMat, tailMat };
          }

          function disposeCar(car) {
            if (!car) return;
            if (car.sticker && car.sticker.tex) car.sticker.tex.dispose();
            car.obj.traverse(node => {
              if (node.geometry && (!node.geometry.userData || !node.geometry.userData.shared)) node.geometry.dispose();
              if (node.material) {
                const mats = Array.isArray(node.material) ? node.material : [node.material];
                for (const m of mats) {
                  if (m && (!m.userData || !m.userData.shared)) {
                    if (m.map && (!m.map.userData || !m.map.userData.shared)) m.map.dispose();
                    m.dispose();
                  }
                }
              }
            });
            scene.remove(car.obj);
          }

          function drawStickerCanvas(canvas, serviceKey, mood, ratio) {
            const svc = SERVICES[serviceKey] || SERVICES.repair;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = mood === 'angry' ? '#d32f2f' : mood === 'worry' ? '#f57c00' : mood === 'happy' ? '#00c853' : '#1e293b';
            ctx.beginPath(); ctx.roundRect(8, 8, 496, 156, 34); ctx.fill();
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 8; ctx.stroke();
            ctx.font = 'bold 54px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            const icon = mood === 'angry' ? '😡' : mood === 'worry' ? '😟' : mood === 'happy' ? '😊' : svc.icon;
            ctx.fillText(icon, 70, 74);
            ctx.font = '900 36px system-ui'; ctx.textAlign = 'left'; ctx.fillStyle = '#ffffff';
            const labelText = mood === 'angry' ? 'НЕДОВОЛЕН' : mood === 'worry' ? 'ЖДЁТ' : mood === 'happy' ? 'ГОТОВО!' : svc.label;
            ctx.fillText(labelText, 122, 74);
            if (mood !== 'happy') {
              ctx.fillStyle = 'rgba(0,0,0,0.45)';
              ctx.beginPath(); ctx.roundRect(36, 126, 440, 18, 9); ctx.fill();
              const r = Math.max(0, Math.min(1, ratio));
              ctx.fillStyle = r > 0.62 ? '#00e676' : r > 0.28 ? '#ffea00' : '#ff1744';
              ctx.beginPath(); ctx.roundRect(36, 126, Math.max(16, 440 * r), 18, 9); ctx.fill();
            }
          }

          function serviceSticker(serviceKey, mood = 'service', ratio = 1) {
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 172;
            drawStickerCanvas(canvas, serviceKey, mood, ratio);
            const tex = new THREE.CanvasTexture(canvas); tex.colorSpace = THREE.SRGBColorSpace;
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
            sprite.scale.set(3.2, 1.08, 1); sprite.position.set(0, 3.35, 0); sprite.renderOrder = 20;
            return { sprite, tex, canvas, mood, step: Math.round(ratio * 20) };
          }

          function updateCarSticker(car) {
            if (!car || !car.sticker) return;
            const ratio = car.maxPatience > 0 ? car.patience / car.maxPatience : 1;
            const mood = car.mood === 'happy' ? 'happy' : ratio < 0.28 ? 'angry' : ratio < 0.62 ? 'worry' : 'service';
            const step = Math.round(ratio * 20);
            if (mood !== car.mood || step !== car.sticker.step) {
              const prevMood = car.mood;
              car.mood = mood;
              car.sticker.mood = mood;
              car.sticker.step = step;
              drawStickerCanvas(car.sticker.canvas, car.service, mood, ratio);
              car.sticker.tex.needsUpdate = true;
              if (mood !== prevMood) {
                if (mood === 'angry') sfx('warning'); else if (mood === 'happy') sfx('happy');
              }
            }
          }

          function updateCarWorkVisual(car, progress, nowSec) {
            if (!car) return;
            if (progress <= 0.001) {
              car.fxGroup.visible = false;
              car.ws.position.set(0, car.wsBaseY, car.wsBaseZ);
              car.ws.rotation.x = -0.18;
              return;
            }
            if (car.service === 'replacement') {
              car.fxGroup.visible = false;
              // Аккуратное снятие и установка стекла прямо над капотом (только на 22 см, без улета в небо)
              if (progress < 0.5) {
                const k = progress * 2;
                car.ws.material.map = crackTex;
                car.ws.position.y = car.wsBaseY + k * 0.22;
                car.ws.position.z = car.wsBaseZ + k * 0.12;
              } else {
                const k = (1 - progress) * 2;
                car.ws.material.map = cleanTex;
                car.ws.position.y = car.wsBaseY + k * 0.22;
                car.ws.position.z = car.wsBaseZ + k * 0.12;
              }
              car.ws.material.needsUpdate = true;
            } else if (car.service === 'repair') {
              car.fxGroup.visible = true;
              car.uvTool.visible = true;
              car.squeegee.visible = false;
              car.uvTool.position.set(Math.sin(nowSec * 5) * 0.26, Math.cos(nowSec * 3.5) * 0.09, 0.03);
              car.uvBulb.scale.setScalar(0.85 + Math.sin(nowSec * 16) * 0.22);
            } else if (car.service === 'tint') {
              car.fxGroup.visible = true;
              car.uvTool.visible = false;
              car.squeegee.visible = true;
              car.squeegee.position.set(Math.sin(nowSec * 7) * 0.4, (0.5 - progress) * 0.36, 0.03);
              car.ws.material.color.setRGB(1 - progress * 0.55, 1 - progress * 0.5, 1 - progress * 0.45);
            }
          }

          function updateToolHud() {
            const names = { replacement: 'Замена стекла', repair: 'Ремонтный набор', tint: 'Плёнка для тонировки' };
            const cap = playerCap();
            document.querySelectorAll('.toolBtn').forEach(b => b.classList.toggle('active', b.dataset.tool === selectedTool));
            const el = document.getElementById('toolStatus');
            if (el) el.innerHTML = `Инструмент: ${names[selectedTool]}<small>Склад: ${player.glass}/${cap} стекол · ${player.supplies.repair}/${cap} наборов · ${player.supplies.tint}/${cap} плёнок</small>`;
          }
          document.querySelectorAll('.toolBtn').forEach(btn => btn.addEventListener('click', () => { selectedTool = btn.dataset.tool; updateToolHud(); sfx('click'); }));

          function spawnCar(b) {
            const lvl = save.unlocked.length;
            const pool = CAR_TYPES.filter(t => t.need <= lvl);
            const type = pool[Math.floor(Math.random() * pool.length)];
            const c = makeCar(type, CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)]);
            const service = SERVICE_KEYS[Math.floor(Math.random() * SERVICE_KEYS.length)];
            if (service === 'tint') { c.ws.material.map = cleanTex; c.ws.material.needsUpdate = true; }
            const maxP = Math.max(28, 48 + save.reputation * 0.12 - save.cars * 0.15);
            const car = {
              ...c, type, service, bay: b, state: 'arrive',
              patience: maxP, maxPatience: maxP,
              path: [{ x: ROAD_X, z: -2 }, { x: ROAD_X, z: LANE_Z }, { x: b.x, z: LANE_Z }, { x: b.x, z: CAR_Z }],
              pi: 0, rot: Math.PI, sticker: null, mood: 'service', jobStarted: false
            };
            car.sticker = serviceSticker(service, 'service', 1);
            car.obj.add(car.sticker.sprite);
            car.obj.position.set(ROAD_X, 0, 16); car.obj.rotation.y = Math.PI;
            b.car = car; b.mechPrep = 0; cars.push(car);
          }

          function moveCar(car, dt) {
            const p = car.path[car.pi]; if (!p) return true;
            car.tailMat.emissiveIntensity = p.rev ? 1.5 : 0.3;
            car.headMat.emissiveIntensity = car.state === 'arrive' ? 1.2 : 0.6;
            const o = car.obj.position, dx = p.x - o.x, dz = p.z - o.z, d = Math.hypot(dx, dz);
            const sp = 10 * dt;
            if (d < sp) { o.x = p.x; o.z = p.z; car.pi++; return car.pi >= car.path.length; }
            o.x += dx / d * sp; o.z += dz / d * sp;
            let target = Math.atan2(dx, dz); if (p.rev) target += Math.PI;
            let diff = target - car.obj.rotation.y; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
            car.obj.rotation.y += diff * Math.min(1, dt * 8);
            return false;
          }

          // ================== Деньги на кассе ==================
          const pile = [];
          function pilePos(i) {
            const layer = Math.floor(i / 8), k = i % 8, c = k % 4, r = Math.floor(k / 4);
            return new THREE.Vector3(8.6 + c * 0.6, 1.16 + layer * 0.13, 6.75 + r * 0.42);
          }
          function addPile(v, from) {
            const m = new THREE.Mesh(moneyGeo, moneyMat); m.castShadow = true;
            const idx = pile.length; pile.push({ mesh: m, v });
            scene.add(m);
            const to = pilePos(Math.min(idx, 47));
            fly(m, from.clone(), () => to, 0.6, () => { m.position.copy(to); if (idx >= 48) m.visible = false; }, false);
          }

          // ================== Летающие предметы ==================
          const flyers = [];
          function fly(mesh, from, toFn, dur, done, remove = true) {
            if (!mesh.parent) scene.add(mesh);
            mesh.position.copy(from);
            flyers.push({ mesh, from, toFn, t: 0, dur, done, remove });
          }
          function updateFlyers(dt) {
            for (let i = flyers.length - 1; i >= 0; i--) {
              const f = flyers[i]; f.t += dt / f.dur;
              const to = f.toFn(), k = Math.min(1, f.t);
              f.mesh.position.lerpVectors(f.from, to, k);
              f.mesh.position.y += Math.sin(k * Math.PI) * 1.5;
              f.mesh.rotation.y += dt * 8;
              if (f.t >= 1) {
                if (f.remove) scene.remove(f.mesh);
                f.done && f.done(); flyers.splice(i, 1);
              }
            }
          }
          const pops = [];
          function popup(text, pos, color) {
            const d = document.createElement('div'); d.className = 'pop'; d.textContent = text;
            if (color) d.style.color = color;
            document.body.appendChild(d); pops.push({ d, pos: pos.clone(), t: 0 });
          }
          function updatePops(dt) {
            const v = new THREE.Vector3();
            for (let i = pops.length - 1; i >= 0; i--) {
              const p = pops[i]; p.t += dt;
              v.copy(p.pos); v.y += 2.5 + p.t * 1.5; v.project(camera);
              p.d.style.left = ((v.x + 1) / 2 * innerWidth) + 'px';
              p.d.style.top = ((1 - v.y) / 2 * innerHeight) + 'px';
              p.d.style.opacity = String(Math.max(0, 1 - p.t / 1.2));
              if (p.t > 1.2) { p.d.remove(); pops.splice(i, 1); }
            }
          }

          // ================== Зоны покупки ==================
          function zoneTex(z) {
            const paid = save.paid[z.id] || 0, left = z.cost - paid;
            return canvasTex(256, 256, (g, W, H) => {
              g.fillStyle = 'rgba(20,32,48,0.82)'; g.fillRect(8, 8, W - 16, H - 16);
              if (paid > 0) { g.fillStyle = '#00c853'; const h = (H - 16) * paid / z.cost; g.fillRect(8, H - 8 - h, W - 16, h); }
              g.setLineDash([22, 14]); g.lineWidth = 8; g.strokeStyle = '#ffffff'; g.strokeRect(8, 8, W - 16, H - 16);
              g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
              g.font = '800 40px system-ui,Roboto,sans-serif'; g.fillText(z.name, W / 2, 90);
              g.fillStyle = '#ffea00'; g.font = '900 56px system-ui,Roboto,sans-serif'; g.fillText(left + ' ₽', W / 2, 160);
            });
          }
          const zoneMeshes = {};
          function refreshZone(z) {
            let m = zoneMeshes[z.id];
            const tex = zoneTex(z);
            if (!m) {
              m = flat(2.2, 2.2, new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }), z.x, 0.055, z.z);
              scene.add(m); zoneMeshes[z.id] = m;
            } else { m.material.map.dispose(); m.material.map = tex; m.material.needsUpdate = true; }
          }
          const zoneVisible = z => !has(z.id) && z.req.every(has);
          function syncZones() {
            for (const z of ZONES) {
              const vis = zoneVisible(z);
              if (vis && !zoneMeshes[z.id]) refreshZone(z);
              if (!vis && zoneMeshes[z.id]) { scene.remove(zoneMeshes[z.id]); delete zoneMeshes[z.id]; }
            }
          }

          // ================== Работники ==================
          const loaders = [];
          let cashier = null;
          function applyUnlock(id, silent) {
            if (id === 'bay2') openBay(bays[1]);
            if (id === 'bay3') openBay(bays[2]);
            if (id.startsWith('loader')) {
              const o = makePerson(0x00b0ff, 0x1e293b, 0x0288d1, 1 + loaders.length); o.position.set(WARE.x + 1, 0, 5);
              loaders.push({ obj: o, glass: 0, stack: [], state: 'toWare', target: null, t: 0 });
            }
            if (id.startsWith('mech')) {
              const b = bays[+id.slice(4) - 1];
              const o = makePerson(0x00c853, 0x1e293b, 0x00e676, 2 + (+id.slice(4))); o.position.set(b.x - 1.1, 0, WORK_Z - 0.7); o.rotation.y = Math.PI * 0.8;
              b.mech = { obj: o };
            }
            if (id === 'cashier') {
              const o = makePerson(0xaa00ff, 0x1e293b, null, 3); o.position.set(9.5, 0, 8.1); o.rotation.y = Math.PI;
              cashier = { obj: o, t: 0 };
            }
            if (!silent) {
              const z = ZONES.find(z => z.id === id);
              popup('Открыто: ' + z.name, new THREE.Vector3(z.x, 0, z.z), '#00e676');
              showToast('🏗️', z.name + ' открыт!', 'Мастерская АВТОСТЕКЛА расширяется!', 'unlock');
              vibrate(60);
            }
          }
          openBay(bays[0]);
          save.unlocked.forEach(id => applyUnlock(id, true));
          syncZones();

          function walkTo(o, tx, tz, speed, dt) {
            const p = o.position, dx = tx - p.x, dz = tz - p.z, d = Math.hypot(dx, dz);
