            const collar = roundedBox(0.36, 0.12, 0.28, accentM, 0, 1.38, 0.02, 0.03, false);
            const belt = box(0.7, 0.09, 0.44, bootM, 0, 0.68, 0);
            const buckle = box(0.14, 0.11, 0.04, M(0xe2e8f0, { r: 0.2, m: 0.85 }), 0, 0.68, 0.23, false);

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.33, 24, 18), skin);
