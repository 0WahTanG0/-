          #rank{background:linear-gradient(145deg,rgba(20,28,40,.92),rgba(12,18,28,.92));color:#fff;font-weight:800;font-size:13px;padding:8px 12px;border-radius:16px;margin-top:7px;min-width:130px;border:1px solid rgba(255,255,255,.12);box-shadow:0 4px 12px rgba(0,0,0,.3)}
          #rank .bar{height:6px;background:#2b3648;border-radius:8px;margin-top:6px;overflow:hidden}
