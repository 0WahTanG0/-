          canvas{display:block}
          #vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(10,14,20,0.32) 100%);mix-blend-mode:multiply}
          #toolPanel{position:fixed;right:14px;bottom:20px;z-index:7;display:flex;flex-direction:column;gap:10px;pointer-events:auto;max-width:44vw}
          .toolBtn{border:2px solid #ffffff66;border-radius:18px;background:linear-gradient(135deg,#34495e,#2c3e50);color:#fff;padding:12px 16px;font-size:14px;font-weight:900;box-shadow:0 6px 0 #1a252f,0 8px 16px rgba(0,0,0,0.3);white-space:nowrap;transition:transform .1s,filter .1s}
          .toolBtn:active{transform:translateY(3px);box-shadow:0 3px 0 #1a252f}
          .toolBtn.active{background:linear-gradient(135deg,#f39c12,#e67e22);color:#17202b;border-color:#ffe29a;transform:scale(1.04)}
          #toolStatus{position:fixed;left:14px;bottom:20px;z-index:7;background:rgba(30,41,59,.92);color:#fff;border:2px solid #ffffff33;border-radius:16px;padding:10px 14px;font-size:13px;font-weight:800;pointer-events:none;max-width:52vw;box-shadow:0 6px 16px rgba(0,0,0,0.3)}
          #toolStatus small{display:block;color:#94a3b8;font-weight:600;margin-top:4px}
          #hud{position:fixed;left:0;right:0;top:0;padding:14px 14px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:5}
          .hud-row{display:flex;justify-content:space-between;align-items:flex-start}
