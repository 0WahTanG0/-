          #rank{background:rgba(20,26,36,.88);color:#fff;font-weight:800;font-size:13px;padding:8px 12px;border-radius:16px;margin-top:7px;min-width:130px;box-shadow:0 2px 8px #0003}
          #rank .bar{height:6px;background:#3a4658;border-radius:8px;margin-top:6px;overflow:hidden}
