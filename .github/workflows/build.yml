          function bayNeed(b) { return b.open ? (b.car ? 2 : 0) + (3 - b.stand) * 0.5 - (b.stand >= 3 ? 99 : 0) - loaders.filter(l => l.target === b).length * 1.5 : -99; }
          function updateLoader(L, dt) {
            const sp = 3.6 * staffMul();
            L.t -= dt;
            if (L.state === 'toWare') {
              if (walkTo(L.obj, WARE.x + 0.4, WARE.z - 0.3, sp, dt)) L.state = 'load';
            } else if (L.state === 'load') {
              animateWalk(L.obj, false, dt);
              const anyNeed = bays.some(b => bayNeed(b) > 0);
              if (L.t <= 0 && L.glass < 3 && anyNeed) { L.glass++; L.t = 0.3 / staffMul(); updateStack(L.obj, L.stack, L.glass); }
              if (L.glass >= 3 || (L.glass > 0 && L.t <= 0 && !anyNeed)) {
                const b = bays.filter(b => b.open).sort((a, c) => bayNeed(c) - bayNeed(a))[0];
                if (b && bayNeed(b) > -50) { L.target = b; L.state = 'toBay'; }
              }
            } else if (L.state === 'toBay') {
              const b = L.target;
              if (walkTo(L.obj, b.x + 1.7, WORK_Z - 0.2, sp, dt)) L.state = 'drop';
            } else if (L.state === 'drop') {
              animateWalk(L.obj, false, dt);
              const b = L.target;
              if (L.t <= 0) {
                if (L.glass > 0 && b.stand < 3) { L.glass--; setStand(b, b.stand + 1); updateStack(L.obj, L.stack, L.glass); L.t = 0.25; }
                else {
                  L.target = null;
                  const nb = L.glass > 0 ? bays.filter(x => x.open && x.stand < 3).sort((a, c) => bayNeed(c) - bayNeed(a))[0] : null;
                  if (nb) { L.target = nb; L.state = 'toBay'; } else L.state = 'toWare';
                }
              }
            }
          }

          // ================== Управление ==================
          const joy = { on: false, id: null, ox: 0, oy: 0, dx: 0, dy: 0 };
          const joyEl = document.getElementById('joy'), knob = document.getElementById('knob');
          let panelOpen = false;
          renderer.domElement.addEventListener('pointerdown', e => {
            if (panelOpen || joy.on) return;
            joy.on = true; joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.dx = joy.dy = 0;
            joyEl.style.left = e.clientX + 'px'; joyEl.style.top = e.clientY + 'px'; joyEl.style.display = 'block';
            knob.style.transform = 'translate(0,0)';
          });
          addEventListener('pointermove', e => {
            if (!joy.on || e.pointerId !== joy.id) return;
            let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy; const d = Math.hypot(dx, dy), R = 50;
            if (d > R) { dx = dx / d * R; dy = dy / d * R; }
            joy.dx = dx / R; joy.dy = dy / R;
            knob.style.transform = `translate(${dx}px,${dy}px)`;
          });
          function joyEnd(e) { if (e.pointerId !== joy.id) return; joy.on = false; joy.dx = joy.dy = 0; joyEl.style.display = 'none'; }
          addEventListener('pointerup', joyEnd); addEventListener('pointercancel', joyEnd);
          const keys = {};
          addEventListener('keydown', e => keys[e.code] = true);
          addEventListener('keyup', e => keys[e.code] = false);
          function vibrate(ms) {
            try {
              if (window.AndroidBridge && typeof window.AndroidBridge.vibrate === 'function') window.AndroidBridge.vibrate(ms);
              else if (navigator.vibrate) navigator.vibrate(ms);
            } catch (e) {}
          }

          // ================== Звуки ==================
          let audioCtx = null, soundEnabled = true;
          function playTone(freq, duration = 0.12, type = 'sine', volume = 0.045, delay = 0) {
            if (!soundEnabled) return;
            try {
              const AC = window.AudioContext || window.webkitAudioContext;
              if (!AC) return;
              if (!audioCtx) audioCtx = new AC();
              if (audioCtx.state === 'suspended') audioCtx.resume();
              const t = audioCtx.currentTime + delay, osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
              osc.type = type; osc.frequency.setValueAtTime(freq, t);
              gain.gain.setValueAtTime(0.0001, t);
              gain.gain.exponentialRampToValueAtTime(volume, t + 0.015);
              gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
              osc.connect(gain); gain.connect(audioCtx.destination);
              osc.start(t); osc.stop(t + duration + 0.02);
            } catch (e) {}
          }
          function sfx(name) {
            if (name === 'upgrade') { playTone(520, .11, 'triangle', .05); playTone(780, .16, 'triangle', .05, .09); playTone(1040, .2, 'sine', .045, .2); }
            else if (name === 'unlock') { playTone(392, .12, 'triangle', .045); playTone(523, .12, 'triangle', .05, .1); playTone(659, .2, 'triangle', .05, .2); }
            else if (name === 'cash') { playTone(880, .07, 'sine', .025); playTone(1175, .1, 'sine', .025, .06); }
            else if (name === 'level') { playTone(440, .15, 'triangle', .055); playTone(660, .15, 'triangle', .055, .12); playTone(880, .25, 'triangle', .06, .24); }
            else if (name === 'warning') { playTone(260, .18, 'square', .025); playTone(210, .2, 'square', .02, .2); }
            else if (name === 'click') playTone(420, .055, 'sine', .018);
            else if (name === 'pickup') { playTone(540, .07, 'triangle', .03); playTone(720, .09, 'triangle', .025, .06); }
            else if (name === 'happy') { playTone(660, .09, 'sine', .03); playTone(880, .12, 'sine', .03, .08); }
          }
          let toastTimer = 0;
          function showToast(icon, title, sub, sound = 'upgrade') {
            const el = document.getElementById('toast');
            if (!el) return;
            el.querySelector('.icon').textContent = icon;
            el.querySelector('.title').textContent = title;
            el.querySelector('.sub').textContent = sub || '';
            el.classList.remove('show');
            void el.offsetWidth; el.classList.add('show');
            clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
            if (sound) sfx(sound);
          }
          document.addEventListener('pointerdown', function unlockAudio() {
            if (!audioCtx) { try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) { audioCtx = new AC(); audioCtx.resume(); } } catch (e) {} }
          }, { once: true, passive: true });

          // ================== Улучшения ==================
          const panel = document.getElementById('panel'), upsEl = document.getElementById('ups');
          function renderPanel() {
            const xpNeed = xpForNextLevel();
            const contractDone = save.cars % 5;
            const contractReward = 120 + save.level * 30;
            document.getElementById('progressCard').innerHTML = `<div class="big">Уровень ${save.level} · ${rankName(save.level)}</div><div class="muted">Опыт: ${save.xp} / ${xpNeed} · Выполнено заказов: ${save.cars}</div><div class="contract"><b>Заказ недели</b><br>Выполни ещё ${5 - contractDone} ${carWord(5 - contractDone)} и получи бонус ${contractReward} ₽.<br><span style="color:#ffd54f">${contractDone}/5 заказов</span></div><div class="contract"><b>Репутация: ${Math.round(save.reputation)}/100</b><br>${reputationText()}<br>Обслуживай клиентов в зелёной зоне терпения, чтобы получать +25% чаевых за скорость!</div>`;
            upsEl.innerHTML = UPGS.map(u => {
              const lv = save.up[u.k], max = lv >= u.max, c = upCost(u);
              return `<div class="up"><div class="t"><div class="n">${u.name}</div><div class="d">${u.desc}</div>
                <div class="lv">${'●'.repeat(lv)}${'○'.repeat(u.max - lv)}</div></div>
                <button data-k="${u.k}" class="${max || save.money < c ? 'no' : ''}">${max ? 'Макс.' : c + ' ₽'}</button></div>`;
            }).join('');
          }
          upsEl.addEventListener('click', e => {
            const k = e.target.dataset && e.target.dataset.k; if (!k) return;
            const u = UPGS.find(u => u.k === k), c = upCost(u);
            if (save.up[k] >= u.max || save.money < c) { vibrate(20); sfx('click'); if (save.money < c) showToast('💰', 'Не хватает денег', `Нужно ещё ${Math.max(0, c - save.money)} ₽`, null); return; }
            save.money -= c; save.up[k]++; persist(); vibrate(40);
            const newLevel = save.up[k];
            const icons = { speed: '👟', cap: '📦', work: '🛠️', price: '📣', staff: '👨‍🔧' };
            showToast(icons[k] || '✨', 'Улучшение куплено!', `${u.name}: уровень ${newLevel}/${u.max}`, 'upgrade');
            renderPanel(); updateHud(true); updateToolHud();
          });
          function openPanel(v) { panelOpen = v; panel.style.display = v ? 'flex' : 'none'; if (v) { renderPanel(); joy.on = false; joyEl.style.display = 'none'; } }
          document.getElementById('upBtn').addEventListener('click', () => openPanel(true));
          document.getElementById('close').addEventListener('click', () => openPanel(false));
          document.getElementById('soundBtn').addEventListener('click', e => {
            soundEnabled = !soundEnabled;
            e.currentTarget.textContent = soundEnabled ? '🔊 Звуки: включены' : '🔇 Звуки: выключены';
            if (soundEnabled) sfx('click');
          });
          document.getElementById('reset').addEventListener('click', () => {
            if (confirm('Удалить прогресс и начать заново?')) { try { localStorage.removeItem('steklo3d'); } catch (e) {} location.reload(); }
          });
          window.onBack = function () { if (panelOpen) { openPanel(false); return ''; } persist(); return 'exit'; };

          // ================== HUD ==================
          const moneyEl = document.getElementById('money'), hintEl = document.getElementById('hint'), comboEl = document.getElementById('comboBadge');
          let shownMoney = save.money;
          let hudCache = { m: -1, lvl: -1, xp: -1, rep: -1, combo: -1 };
          function updateHud(force = false) {
            const mRound = Math.round(shownMoney);
            if (force || mRound !== hudCache.m) { hudCache.m = mRound; moneyEl.textContent = mRound + ' ₽'; }
            if (force || save.level !== hudCache.lvl || save.xp !== hudCache.xp) {
              hudCache.lvl = save.level; hudCache.xp = save.xp;
              const need = xpForNextLevel(), prev = xpForLevel(save.level);
              document.getElementById('rankTitle').textContent = `Уровень ${save.level} · ${rankName(save.level)}`;
              document.getElementById('rankXp').textContent = `${Math.max(0, save.xp - prev)} / ${need - prev} опыта`;
              document.getElementById('rankFill').style.width = `${Math.max(0, Math.min(100, (save.xp - prev) / Math.max(1, need - prev) * 100))}%`;
            }
            const repRound = Math.round(save.reputation);
            if (force || repRound !== hudCache.rep) {
              hudCache.rep = repRound;
              document.getElementById('repText').textContent = `Репутация мастерской · ${repRound}/100`;
              document.getElementById('repFill').style.width = `${save.reputation}%`;
            }
            if (force || fastStreak !== hudCache.combo) {
              hudCache.combo = fastStreak;
              if (fastStreak >= 2) {
                comboEl.style.display = 'inline-block';
                comboEl.textContent = `🔥 Быстрый сервис ×${fastStreak} (+25% чаевых)`;
              } else comboEl.style.display = 'none';
            }
          }
          function xpForLevel(level) { return Math.round(100 * (level - 1) + 25 * (level - 1) * (level - 2)); }
          function xpForNextLevel() { return xpForLevel(save.level + 1); }
          function rankName(level) { return level >= 10 ? 'Легенда АВТОСТЕКЛА' : level >= 7 ? 'Эксперт' : level >= 5 ? 'Профи' : level >= 3 ? 'Мастер' : level >= 2 ? 'Подмастерье' : 'Новичок'; }
          function reputationText() { return save.reputation >= 80 ? 'Отличная репутация — клиенты приезжают чаще.' : save.reputation >= 55 ? 'Хорошая репутация — мастерская набирает популярность.' : save.reputation >= 30 ? 'Средняя репутация — старайся обслуживать быстрее.' : 'Плохая репутация — клиенты реже приезжают.'; }
          function changeReputation(delta) { save.reputation = Math.max(0, Math.min(100, save.reputation + delta)); }
          function carWord(n) { const a = n % 10, b = n % 100; return b >= 11 && b <= 14 ? 'заказов' : a === 1 ? 'заказ' : a >= 2 && a <= 4 ? 'заказа' : 'заказов'; }
          const arrow = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.9, 12), new THREE.MeshBasicMaterial({ color: 0xffea00 }));
          arrow.rotation.x = Math.PI; scene.add(arrow);

          function objective() {
            for (const z of ZONES) if (zoneVisible(z) && save.money >= Math.min(z.cost - (save.paid[z.id] || 0), 1) && save.money >= (z.cost - (save.paid[z.id] || 0)) * 0.5)
              return { x: z.x, z: z.z, text: 'Открой: ' + z.name };
            if (pile.length && !cashier) return { x: CASH.x, z: CASH.z, text: 'Забери деньги на кассе' };
            const waiting = bays.filter(b => b.open && b.car && b.car.state === 'wait');
            const activeJob = waiting.find(b => !b.jobReady && !b.mech);
            if (activeJob) {
              const service = activeJob.car.service;
              if (selectedTool !== service) return { x: player.obj.position.x, z: player.obj.position.z, text: `Выбери инструмент: ${SERVICES[service].name}` };
              if (service === 'repair' && player.supplies.repair === 0) return { x: WARE.x, z: WARE.z, text: 'Возьми ремонтный набор на складе' };
              if (service === 'tint' && player.supplies.tint === 0) return { x: WARE.x, z: WARE.z, text: 'Возьми плёнку для тонировки на складе' };
              if (service === 'replacement' && player.glass === 0 && activeJob.stand === 0) return { x: WARE.x, z: WARE.z, text: 'Возьми новое лобовое стекло на складе' };
              return { x: activeJob.x, z: WORK_Z, text: `Выполни заказ: ${SERVICES[service].name}` };
            }
            return null;
          }

          // ================== Игровой цикл ==================
          let tick = { ware: 0, drop: 0, cash: 0, pay: 0, save: 0, hint: 0 };
          const v3 = new THREE.Vector3();
          function inCircle(o, x, z, r) { return Math.hypot(o.position.x - x, o.position.z - z) < r; }
          function inSquare(o, x, z, h) { return Math.abs(o.position.x - x) < h && Math.abs(o.position.z - z) < h; }

          function update(dt) {
            const P = player.obj;
            const nowSec = performance.now() / 1000;
            tintCarousel.rotation.y = nowSec * 0.7;

            let mx = joy.dx, mz = joy.dy;
            if (keys.ArrowLeft || keys.KeyA) mx = -1; if (keys.ArrowRight || keys.KeyD) mx = 1;
            if (keys.ArrowUp || keys.KeyW) mz = -1; if (keys.ArrowDown || keys.KeyS) mz = 1;
            const ml = Math.hypot(mx, mz);
            if (ml > 0.1) {
              const s = playerSpeed() * Math.min(1, ml) * dt;
              P.position.x += mx / ml * s; P.position.z += mz / ml * s;
              P.rotation.y = Math.atan2(mx, mz);
            }
            animateWalk(P, ml > 0.1, dt);
            P.position.x = Math.max(BOUNDS.x0, Math.min(BOUNDS.x1, P.position.x));
            P.position.z = Math.max(BOUNDS.z0, Math.min(BOUNDS.z1, P.position.z));
            for (const c of [{ x: WARE.x, z: 7.8, hw: 2.1, hd: 0.7 }, { x: 9.5, z: 7.0, hw: 1.7, hd: 0.65 }]) {
              const dx = P.position.x - c.x, dz = P.position.z - c.z, ox = c.hw + 0.35 - Math.abs(dx), oz = c.hd + 0.35 - Math.abs(dz);
              if (ox > 0 && oz > 0) { if (ox < oz) P.position.x += Math.sign(dx) * ox; else P.position.z += Math.sign(dz) * oz; }
            }

            // Склад
            tick.ware -= dt;
            const maxCap = playerCap();
            if (inCircle(P, WARE.x, WARE.z, 1.55) && tick.ware <= 0) {
              tick.ware = 0.55;
              if (selectedTool === 'replacement' && player.glass < maxCap) {
                player.glass++; updateStack(P, player.stack, player.glass); sfx('pickup');
              } else if (selectedTool === 'repair' && player.supplies.repair < maxCap) {
                player.supplies.repair++; sfx('pickup');
              } else if (selectedTool === 'tint' && player.supplies.tint < maxCap) {
                player.supplies.tint++; sfx('pickup');
              }
              updateToolHud();
            }

            // Боксы
            tick.drop -= dt;
            for (const b of bays) {
              if (!b.open) continue;
              const here = inCircle(P, b.x, WORK_Z, 1.35);

              if (here && player.glass > 0 && b.stand + b.incoming < 3 && (!b.car || b.car.service !== 'replacement' || b.jobReady) && tick.drop <= 0) {
                b.incoming++; tick.drop = 0.25; player.glass--; updateStack(P, player.stack, player.glass); updateToolHud();
                const m = new THREE.Mesh(glassGeo, glassMat);
                fly(m, P.position.clone().setY(1.5), () => v3.set(b.x + 1.7, 0.6, -4.4), 0.25, () => {
                  b.incoming--; setStand(b, Math.min(3, b.stand + 1));
                });
              }

              if (here && b.car && b.car.state === 'wait' && !b.jobReady && tick.drop <= 0) {
                const needed = b.car.service;
                if (needed === selectedTool) {
                  if (needed === 'replacement' && b.stand > 0) {
                    b.jobReady = true; tick.drop = 0.4;
                  } else if (needed === 'replacement' && player.glass > 0 && b.stand + b.incoming < 3) {
                    b.incoming++; tick.drop = 0.25; player.glass--; updateStack(P, player.stack, player.glass); updateToolHud();
                    const m = new THREE.Mesh(glassGeo, glassMat);
                    fly(m, P.position.clone().setY(1.5), () => v3.set(b.x + 1.7, 0.6, -4.4), 0.25, () => {
                      b.incoming--; setStand(b, Math.min(3, b.stand + 1)); b.jobReady = true;
                    });
                  } else if (needed === 'repair' && player.supplies.repair > 0) {
                    player.supplies.repair--; b.jobReady = true; tick.drop = 0.5; updateToolHud();
                  } else if (needed === 'tint' && player.supplies.tint > 0) {
                    player.supplies.tint--; b.jobReady = true; tick.drop = 0.5; updateToolHud();
                  }
                } else if (tick.drop <= 0) {
                  tick.drop = 0.5;
                  hintEl.textContent = `Нужен инструмент: ${SERVICES[needed].name}`;
                  hintEl.style.opacity = '1';
                }
              }

              if (b.mech && b.car && b.car.state === 'wait' && !b.jobReady) {
                const needed = b.car.service;
                if (needed === 'replacement') {
                  if (b.stand > 0) b.jobReady = true;
                } else {
                  b.mechPrep = (b.mechPrep || 0) + dt * staffMul();
                  animateWalk(b.mech.obj, true, dt * 0.4);
                  if (b.mechPrep >= 1.1) { b.jobReady = true; b.mechPrep = 0; }
                }
              }

              if (b.ring) b.ring.material.color.set(here ? 0xffea00 : 0xffffff);
              if (!b.car) { b.cool -= dt; if (b.cool <= 0) spawnCar(b); }
              const car = b.car;
              if (car && car.state === 'wait') {
                car.patience -= dt;
                updateCarSticker(car);
                if (car.sticker) car.sticker.sprite.position.y = 3.25 + Math.sin(nowSec * 2.8 + b.i) * 0.06;
                if (car.patience <= 0) { customerLeaves(b, car); continue; }
                const workers = (here ? 1 : 0) + (b.mech ? staffMul() * 0.9 : 0);
                if (b.jobReady && workers > 0) {
